<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WoW Forever Warrior Simulator</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #0f1218; color: #e6e9ef;
    font-family: "Segoe UI", Tahoma, sans-serif; display: flex; justify-content: center;
    user-select: none;
  }
  body { align-items: flex-start; flex-wrap: wrap; }
  #app { width: 100%; max-width: 760px; padding: 16px; }
  #buffpanel {
    width: 230px; margin: 16px 0 0 16px; padding: 10px 12px 12px; position: sticky; top: 16px;
    background: #171b24; border: 1px solid #2f394c; border-radius: 6px;
  }
  #buffpanel { max-height: calc(100vh - 32px); overflow-y: auto; }
  #buffpanel h2 { font-size: 15px; color: var(--accent); margin: 0 0 8px; }
  #buffpanel section + section { margin-top: 14px; padding-top: 10px; border-top: 1px solid #2a3242; }
  .buffbtns { display: flex; gap: 6px; margin-bottom: 8px; }
  .buffbtns button {
    flex: 1; font: inherit; font-size: 12px; font-weight: 600; padding: 4px; cursor: pointer;
    background: #232b3a; color: #e6e9ef; border: 1px solid #3d4860; border-radius: 4px;
  }
  .buffbtns button:hover { border-color: var(--accent); }
  .rbuff {
    display: flex; align-items: center; gap: 8px; padding: 5px 4px; cursor: pointer; border-radius: 4px;
    font-size: 12px; opacity: .55;
  }
  .rbuff:hover { background: #1e2430; }
  .rbuff.on { opacity: 1; }
  .rbuff img { width: 26px; height: 26px; border: 1px solid #3d4860; border-radius: 4px; flex: none; }
  .rbuff.on img { border-color: #f5c451; }
  .rbuff small { display: block; color: #76819a; font-size: 10px; line-height: 1.25; }
  .rbuff input { accent-color: #f5c451; flex: none; }
  @media (max-width: 1040px) { #buffpanel { position: static; width: calc(100% - 32px); max-width: 728px; } }
  #startwrap {
    display: none; position: absolute; inset: 40px 0 0; z-index: 3; align-items: center; justify-content: center;
    background: rgba(15, 18, 24, .6);
  }
  #arena.idle #startwrap { display: flex; flex-direction: column; gap: 14px; }
  #hpsetting { font-size: 13px; color: #e6e9ef; display: flex; align-items: center; gap: 8px; }
  #hpinput {
    width: 120px; padding: 5px 8px; font: inherit; font-size: 14px; font-weight: 700; text-align: right;
    background: #171b24; color: #f5c451; border: 1px solid #3d4860; border-radius: 4px;
  }
  #start {
    font: inherit; font-size: 22px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
    padding: 16px 44px; color: #fff; background: linear-gradient(#3fa535, #1f6a1a); border: 2px solid #7fdc6f; border-radius: 8px;
  }
  #start:hover { filter: brightness(1.15); }
  header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; }
  h1 { font-size: 20px; margin: 0; color: var(--accent); }
  #meter { font-size: 14px; color: #9aa4b5; font-variant-numeric: tabular-nums; }
  #meter b { color: #f5c451; }

  #arena {
    position: relative; height: 300px; margin-top: 12px; overflow: hidden;
    background: radial-gradient(ellipse at 50% 80%, #232b3a 0%, #131720 70%);
    border: 1px solid #2f394c; border-radius: 6px;
  }
  #target {
    position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%);
    text-align: center; color: #9aa4b5; font-size: 12px;
  }
  #target svg { display: block; margin: 0 auto 4px; }
  #target.hit svg { animation: shake .15s; }
  @keyframes shake { 25% { transform: translateX(-4px) rotate(-2deg); } 75% { transform: translateX(4px) rotate(2deg); } }

  #hpbar {
    position: absolute; left: 12px; right: 12px; top: 10px; height: 20px; background: #1a2a12;
    border: 1px solid #3d5a2a; border-radius: 4px; overflow: hidden;
  }
  #hpfill { height: 100%; width: 100%; background: linear-gradient(#4fb53a, #2e7d20); }
  #hpbar.execute #hpfill { background: linear-gradient(#e0362a, #a3160e); }
  #hpmark { position: absolute; left: 20%; top: 0; bottom: 0; width: 2px; background: #f5c451; opacity: .7; }
  #hptext {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; text-shadow: 1px 1px 2px #000; font-variant-numeric: tabular-nums;
  }
  .floater {
    position: absolute; font-weight: 800; font-size: 20px; pointer-events: none; white-space: nowrap;
    text-shadow: 0 0 3px #000, 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
    animation: floatUp 1.4s ease-out forwards; transform: translateX(-50%);
  }
  .floater.white { color: #fff; }
  .floater.yellow { color: #ffe100; }
  .floater.crit { font-size: 34px; animation-name: floatCrit; }
  .floater.avoid { color: #ddd; font-size: 16px; font-weight: 600; }
  .floater.bleed { font-size: 14px; }
  .floater.rage { color: #ff5a4a; font-size: 15px; }
  @keyframes floatUp {
    from { opacity: 1; margin-top: 0; } 70% { opacity: 1; } to { opacity: 0; margin-top: -130px; }
  }
  @keyframes floatCrit {
    0% { opacity: 1; margin-top: 0; font-size: 50px; } 15% { font-size: 34px; }
    70% { opacity: 1; } 100% { opacity: 0; margin-top: -130px; }
  }

  #stances { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12px; color: #9aa4b5; }
  .stance {
    display: flex; align-items: center; gap: 6px; padding: 3px 10px 3px 3px; cursor: pointer; font: inherit; font-size: 12px;
    background: #171b24; color: #76819a; border: 2px solid #2a3242; border-radius: 6px; opacity: .6;
  }
  .stance img { width: 26px; height: 26px; border-radius: 4px; display: block; }
  .stance.active { opacity: 1; color: #f5c451; font-weight: 700; border-color: #f5c451; box-shadow: 0 0 8px rgba(255, 209, 0, .5); }
  .ability.proc { border-color: #ffe100; animation: proc .6s infinite alternate; }
  @keyframes proc { from { box-shadow: 0 0 4px #ffe100; } to { box-shadow: 0 0 14px #ffe100, inset 0 0 10px rgba(255,225,0,.5); } }
  #buffs { height: 62px; overflow: hidden; margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; align-content: flex-start; }
  .buff { height: 28px; }
  .buff {
    font-size: 12px; padding: 4px 8px; border-radius: 4px; background: #1e2430;
    border: 1px solid #3d4860; color: #f5c451; font-variant-numeric: tabular-nums;
  }

  .swing { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 11px; color: #9aa4b5; }
  .swing span { width: 62px; }
  .swingbar { flex: 1; height: 6px; background: #1a1f2a; border-radius: 3px; overflow: hidden; }
  .swingbar div { height: 100%; width: 0; background: #c3cad8; }

  #ragebar {
    position: relative; height: 28px; margin-top: 10px; background: #2a0d0a;
    border: 1px solid #5c1f18; border-radius: 4px; overflow: hidden;
  }
  #ragefill { height: 100%; width: 0; background: linear-gradient(#e0362a, #a3160e); }
  #ragetext {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px; text-shadow: 1px 1px 2px #000; font-variant-numeric: tabular-nums;
  }

  #bar { display: grid; grid-template-columns: repeat(11, 1fr); gap: 6px; margin-top: 12px; }
  .slot { text-align: center; font-size: 10px; color: #9aa4b5; line-height: 1.2; }
  .ability {
    position: relative; display: block; width: 100%; aspect-ratio: 1; margin-bottom: 3px;
    border: 2px solid #3d4860; border-radius: 6px; overflow: hidden;
    background: #151a23 center / cover no-repeat; color: #e6e9ef; cursor: pointer; padding: 0; font: inherit;
  }
  .ability:hover { border-color: var(--accent); }
  .ability:active { transform: scale(.95); }
  .ability .key, .ability .cost {
    position: absolute; font-size: 11px; font-weight: 700;
    text-shadow: 0 0 2px #000, 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
  }
  .ability .key { top: 2px; left: 4px; color: #fff; }
  .ability .cost { bottom: 2px; right: 4px; color: #ff8a7b; }

  #tab-combat { position: relative; }
  #summary {
    display: none; position: absolute; inset: 12px 0 0; z-index: 5; padding: 4px 18px 18px; overflow: auto;
    background: rgba(15, 18, 24, .97); border: 1px solid var(--accent); border-radius: 6px;
  }
  #summary.show { display: block; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .wcl-meta { font-size: 12px; color: #9aa4b5; margin: 4px 0 2px; }
  .wcl-meta b { color: #f5c451; }
  table.wcl { font-size: 12px; background: #0b0b0b; border: 1px solid #333; margin-top: 8px; }
  table.wcl th { background: #1a1a1a; color: #e1f2f5; font-size: 11px; padding: 5px 6px; border-bottom: 1px solid #333; white-space: nowrap; }
  table.wcl td { padding: 3px 6px; border-bottom: 1px solid #1c1c1c; color: #ddd; white-space: nowrap; }
  table.wcl tr:nth-child(even) td { background: #121212; }
  table.wcl tr:hover td { background: #1e2a30; }
  .wcl-name { color: #ffe680 !important; font-weight: 600; }
  .wcl-name img { width: 18px; height: 18px; vertical-align: middle; margin-right: 6px; border: 1px solid #444; }
  .wcl-amount { width: 34%; }
  .wcl-amount > span { display: inline-block; vertical-align: middle; }
  .wcl-pct { width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
  .wcl-bar { width: calc(100% - 110px); height: 12px; margin: 0 6px; }
  .wcl-bar i { display: block; height: 100%; background: var(--accent); border-radius: 1px; }
  .wcl-total { width: 50px; text-align: right; font-variant-numeric: tabular-nums; }
  .wcl-totalrow td { background: #1a1a1a !important; font-weight: 700; color: #fff; border-top: 1px solid #333; }
  .reset {
    display: block; width: 100%; margin-top: 14px; padding: 14px; cursor: pointer;
    font: inherit; font-size: 20px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase;
    color: #fff; background: linear-gradient(#c0392b, #7d1810); border: 2px solid #e0685c; border-radius: 8px;
  }
  .reset:hover { filter: brightness(1.15); }
  .reset:active { transform: scale(.99); }
  nav { display: flex; gap: 4px; margin-top: 12px; border-bottom: 1px solid #2f394c; }
  nav button {
    font: inherit; font-size: 13px; font-weight: 600; padding: 6px 16px; cursor: pointer;
    background: #171b24; color: #9aa4b5; border: 1px solid #2f394c; border-bottom: none; border-radius: 6px 6px 0 0;
  }
  nav button.active { background: #232b3a; color: #f5c451; }
  .tab { display: none; }
  .tab.active { display: block; }

  table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13px; }
  th { text-align: left; color: var(--accent); font-size: 12px; padding: 4px 8px; border-bottom: 1px solid #2f394c; }
  td { padding: 5px 8px; border-bottom: 1px solid #1e2430; vertical-align: middle; }
  td.dim, .dim { color: #76819a; }
  .q-epic { color: #a335ee; font-weight: 600; } .q-rare { color: #0070dd; font-weight: 600; }
  .custom-toggle { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .custom-toggle input { accent-color: #f5c451; width: 16px; height: 16px; }
  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-top: 10px; }
  .fields label { font-size: 12px; color: #9aa4b5; display: flex; flex-direction: column; gap: 3px; }
  .fields input {
    padding: 6px 8px; font: inherit; font-size: 15px; font-weight: 700; background: #171b24; color: #f5c451;
    border: 1px solid #3d4860; border-radius: 4px; width: 100%;
  }
  .fields.off { opacity: .45; }
  .plain-btn {
    font: inherit; font-size: 12px; font-weight: 600; padding: 5px 12px; margin-top: 10px; cursor: pointer;
    background: #232b3a; color: #e6e9ef; border: 1px solid #3d4860; border-radius: 4px;
  }
  .plain-btn:hover { border-color: var(--accent); }
  .tab h2 { font-size: 15px; color: var(--accent); margin: 18px 0 0; }
  .statgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px; margin-top: 10px; }
  .stat { background: #171b24; border: 1px solid #2a3242; border-radius: 4px; padding: 6px 10px; font-size: 12px; color: #9aa4b5; }
  .stat b { display: block; font-size: 17px; color: #f5c451; }
  .talent-icon, .buff img { width: 28px; height: 28px; border: 1px solid #3d4860; border-radius: 4px; display: block; }
  .buff { display: flex; align-items: center; gap: 6px; }
  .buff img { width: 18px; height: 18px; }
  .ench { color: #1eff00; font-size: 11px; }
  .rank { color: #f5c451; font-weight: 700; white-space: nowrap; }
  .tag { font-size: 10px; padding: 1px 6px; border-radius: 8px; white-space: nowrap; }
  .trees { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; }
  .tree { background: #171b24; border: 1px solid #2a3242; border-radius: 6px; padding: 0 14px 14px; margin-top: 12px; }
  .tree h2 { margin: 10px 0; text-align: center; }
  .tgrid { display: grid; grid-template-columns: repeat(4, 40px); grid-template-rows: repeat(7, 40px); gap: 14px 10px; }
  .tnode {
    position: relative; z-index: 1; width: 40px; height: 40px; border: 2px solid #f5c451; border-radius: 5px;
    background: #151a23 center / cover no-repeat;
  }
  .tnode span {
    position: absolute; right: -6px; bottom: -6px; font-size: 10px; font-weight: 700; padding: 0 3px;
    background: #000; border-radius: 3px; color: #f5c451;
  }
  .tnode.partial { border-color: #40bf40; } .tnode.partial span { color: #40bf40; }
  .tnode.empty { border-color: #343c4c; filter: grayscale(1) brightness(.8); } .tnode.empty span { color: #999; }
  .tnode i {
    position: absolute; left: -6px; top: -6px; font-size: 9px; font-style: normal; font-weight: 700; padding: 0 3px;
    background: #1f3a1c; color: #7fdc6f; border-radius: 3px;
  }
  .tlink { width: 4px; justify-self: center; background: #343c4c; margin: 20px 0; }
  .tlink.on { background: #f5c451; }
  #talent-tip {
    display: none; position: fixed; z-index: 50; max-width: 300px; padding: 9px 11px; pointer-events: none;
    background: #0b0e13; border: 1px solid var(--accent); border-radius: 6px; box-shadow: 0 4px 14px rgba(0, 0, 0, .7);
    font-size: 12px; line-height: 1.4; color: #e6e9ef;
  }
  #talent-tip .tip-head { display: flex; justify-content: space-between; gap: 14px; align-items: baseline; }
  #talent-tip .tip-head b { font-size: 14px; color: #fff; }
  #talent-tip .tip-head span { color: #9aa4b5; white-space: nowrap; }
  #talent-tip .tip-new { color: #7fdc6f; font-size: 11px; }
  #talent-tip .tip-desc { color: #f5c451; margin-top: 5px; }
  #talent-tip .tip-status { margin-top: 6px; font-size: 11px; color: #76819a; }
  #talent-tip .tip-status.sim { color: #7fdc6f; }
  .tnode { cursor: help; }
  .tag.sim { background: #1f3a1c; color: #7fdc6f; } .tag.off { background: #1e2430; color: #76819a; }
  .ability .cdmask { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: rgba(0,0,0,.72); pointer-events: none; }
  .ability .cdtext {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 800; color: #fff; text-shadow: 1px 1px 2px #000; pointer-events: none;
  }
  #keybar { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 12px; color: #9aa4b5; }
  #keybar button {
    font: inherit; font-size: 12px; font-weight: 600; padding: 4px 10px; cursor: pointer;
    background: #232b3a; color: #e6e9ef; border: 1px solid #3d4860; border-radius: 4px;
  }
  #keybar button:hover { border-color: var(--accent); }
  #keybar button.active { background: #f5c451; color: #0f1218; border-color: #f5c451; }
  #rebind-hint.warn { color: #ff7a6b; font-weight: 700; }
  #rebind-reset { display: none; }
  #keybar.editing #rebind-reset { display: inline-block; }
  #bar.editing .ability { filter: none; border-style: dashed; border-color: var(--accent); }
  #bar.editing .ability.rebind-target { border-style: solid; border-color: #40bf40; box-shadow: 0 0 10px #40bf40; }
  .ability.norage { filter: grayscale(.8) brightness(.6); }
  .ability.queued { border-color: #ffe100; box-shadow: 0 0 10px #ffe100, inset 0 0 10px rgba(255,225,0,.4); }
  .ability.denied { animation: denied .2s; }
  @keyframes denied { 50% { border-color: #ff3020; } }

  #log {
    margin-top: 12px; height: 132px; overflow: hidden; font-size: 12px; line-height: 1.35;
    background: #171b24; border: 1px solid #2a3242; border-radius: 4px; padding: 6px 8px;
    display: flex; flex-direction: column; justify-content: flex-end; color: #9aa4b5;
  }
  #log .y { color: #ffe100; } #log .w { color: #fff; } #log .r { color: #ff7a6b; }
  footer { margin-top: 10px; font-size: 11px; color: #667089; line-height: 1.4; }

  /* Theme: modern slate */
  :root { --accent: #c79c6e; }
  body {
    font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
    background: #0f1218 radial-gradient(1100px 520px at 50% -180px, #1b2233, transparent) no-repeat;
  }
  h1 { color: var(--accent); font-weight: 700; letter-spacing: .2px; }
  #meter { color: #9aa4b5; }
  nav { border-bottom: none; gap: 6px; }
  nav button { border: 1px solid #2a3242; border-radius: 999px; padding: 6px 18px; background: #171b24; transition: background .12s, color .12s; }
  nav button:hover { color: #e6e9ef; border-color: #3d4860; }
  nav button.active { background: var(--accent); color: #0f1218; border-color: var(--accent); }
  #arena { border-radius: 12px; border-color: #2a3242; background: radial-gradient(ellipse at 50% 85%, #232b3a 0%, #131720 72%); box-shadow: inset 0 0 70px rgba(0, 0, 0, .35); }
  #log, .tree, #buffpanel, .stat, #summary { border-radius: 10px; }
  #buffpanel { box-shadow: 0 6px 24px rgba(0, 0, 0, .25); }
  #buffpanel h2, .tab h2 { font-size: 12px; letter-spacing: .6px; text-transform: uppercase; }
  .ability { border-radius: 10px; }
  .ability:hover { border-color: var(--accent); }
  #ragebar, #hpbar, #manabar { border-radius: 8px; }
  .swingbar { border-radius: 999px; }
  .buff { border-radius: 999px; padding: 4px 10px; }
  .reset, #start { border-radius: 10px; }
  .stance { border-radius: 999px; }
  .stat b { color: #f5c451; }
  table:not(.wcl) td { border-bottom-color: #1e2430; }
  table:not(.wcl) th { color: #9aa4b5; text-transform: uppercase; letter-spacing: .5px; font-size: 11px; }
  footer { color: #667089; }

  .castbar { position: relative; height: 16px; border: 1px solid #2a3242; }
  #castbar { background: linear-gradient(#f5c451, #c79100); }
  #casttext {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-style: normal; font-size: 11px; font-weight: 700; color: #fff; text-shadow: 1px 1px 2px #000;
  }
  #specbar { display: flex; gap: 6px; margin-top: 10px; }
  #specbar button {
    flex: 1; font: inherit; font-size: 14px; font-weight: 700; padding: 8px; cursor: pointer;
    background: #171b24; color: #9aa4b5; border: 2px solid #2f394c; border-radius: 6px;
  }
  #specbar button:hover { border-color: var(--accent); }
  #specbar button.active { background: #2b2219; color: var(--accent); border-color: var(--accent); }
  .castbar { position: relative; height: 16px; border: 1px solid #2a3242; }
  #castbar { background: linear-gradient(#f5c451, #c79100); }
  #casttext {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-style: normal; font-size: 11px; font-weight: 700; color: #fff; text-shadow: 1px 1px 2px #000;
  }
  #specbar { display: flex; gap: 6px; margin-top: 10px; }
  #specbar button {
    flex: 1; font: inherit; font-size: 14px; font-weight: 700; padding: 8px; cursor: pointer;
    background: #171b24; color: #9aa4b5; border: 2px solid #2f394c; border-radius: 6px;
  }
  #specbar button:hover { border-color: var(--accent); }
  #specbar button.active { background: #2b2219; color: var(--accent); border-color: var(--accent); }
  .home { display: inline-block; margin-bottom: 8px; font-size: 12px; color: #9aa4b5; text-decoration: none; }
  .home:hover { color: var(--accent); }
</style>
</head>
<body>
<aside id="buffpanel"></aside>
<div id="app">
  <a class="home" href="https://wowf-gameplay.github.io/">&larr; All WoW Forever sims</a>
  <header>
    <h1>WoW Forever &mdash; Warrior (60)</h1>
    <div id="meter"></div>
  </header>

  <nav>
    <button data-tab="combat" class="active">Combat</button>
    <button data-tab="gear">Gear</button>
    <button data-tab="talents">Talents</button>
    <button data-tab="stats">Stats</button>
  </nav>
  <div id="specbar">
    <button data-spec="fury">Fury (dual wield)</button>

        <ellipse cx="45" cy="72" rx="20" ry="26" fill="#b08a55" stroke="#6b4a2a" stroke-width="2"/>
        <circle cx="45" cy="28" r="18" fill="#c9a36a" stroke="#6b4a2a" stroke-width="2"/>
        <circle cx="45" cy="72" r="9" fill="none" stroke="#a3160e" stroke-width="3"/>

    <button class="stance" data-stance="berserker" title="Berserker Stance. +3% crit. Required for Whirlwind, Berserker Rage and Recklessness."><img src="https://wow.zamimg.com/images/wow/icons/large/ability_racial_avatar.jpg" alt="">Berserker</button>

</div>

<script>
// ---------------------------------------------------------------------------
// Character / target setup. Gear, enchants and talents follow the MythicSim WoW Forever
// tier-list presets: "DPS Warrior" (dual wield fury) and "Arms Warrior" (two-handed sword).
// ---------------------------------------------------------------------------
const BASE = { race: 'Human', str: 120, agi: 80, ap: 160 };  // level 60 warrior, naked
const BATTLE_SHOUT_AP = 139;                                 // Forever rank 7
const CRIT_RATING_PER_PCT = 14, HIT_RATING_PER_PCT = 10;     // Forever item ratings at level 60
const store = {
  get(key, fallback) { try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); } catch { return fallback; } },
  set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} },
};

// ench: stats added by the enchant on that slot.
const ITEMS = {
  lionheart:  { slot: 'Head',      name: 'Lionheart Helm',          q: 'epic', icon: 'inv_helmet_36', str: 18, hitRating: 20, critRating: 28, enchant: '+8 Strength', ench: { str: 8 } },
  jewel:      { slot: 'Neck',      name: 'Imperial Jewel',          q: 'rare', icon: 'inv_misc_gem_sapphire_01', ap: 32 },
  truestrike: { slot: 'Shoulders', name: 'Truestrike Shoulders',    q: 'rare', icon: 'inv_shoulder_10', ap: 24, hitRating: 20 },
  baron:      { slot: 'Back',      name: 'Cape of the Black Baron', q: 'rare', icon: 'inv_misc_cape_20', agi: 15, ap: 20, enchant: '+3 Agility', ench: { agi: 3 } },
  savage:     { slot: 'Chest',     name: 'Savage Gladiator Chain',  q: 'epic', icon: 'inv_chest_chain_15', str: 16, agi: 14, critRating: 21, enchant: '+4 All Stats', ench: { str: 4, agi: 4 } },
  battleborn: { slot: 'Wrist',     name: 'Battleborn Armbraces',    q: 'rare', icon: 'inv_bracer_17', hitRating: 10, critRating: 14, enchant: '+9 Strength', ench: { str: 9 } },
  deathgrips: { slot: 'Hands',     name: 'Death Grips',             q: 'rare', icon: 'inv_gauntlets_13', str: 22, hitRating: 5, enchant: '+7 Strength', ench: { str: 7 } },
  girdle:     { slot: 'Waist',     name: "Marksman's Girdle",       q: 'rare', icon: 'inv_belt_18', agi: 21, hitRating: 10 },
  woolies:    { slot: 'Legs',      name: 'Warbear Woolies',         q: 'rare', icon: 'inv_pants_wolf', str: 28, agi: 18, enchant: '+8 Strength', ench: { str: 8 } },
  bloodmail:  { slot: 'Feet',      name: 'Bloodmail Boots',         q: 'rare', icon: 'inv_boots_01', str: 9, agi: 9, hitRating: 10, enchant: '+7 Agility', ench: { agi: 7 } },
  elven:      { slot: 'Ring',      name: 'Tarnished Elven Ring',    q: 'rare', icon: 'inv_jewelry_ring_13', agi: 15, hitRating: 10 },
  blackstone: { slot: 'Ring',      name: 'Blackstone Ring',         q: 'rare', icon: 'inv_jewelry_ring_17', ap: 20, hitRating: 10 },
  trinket:    { slot: 'Trinket',   name: null },
  ironfoe:    { slot: 'Main hand', name: 'Ironfoe',                 q: 'epic', icon: 'spell_frost_frostbrand', weapon: { min: 73, max: 136, speed: 2.4, type: 'Mace' },
                enchant: 'Crusader', note: 'Chance on hit: 2 extra attacks' },
  chorush:    { slot: 'Off hand',  name: "Cho'Rush's Blade",        q: 'rare', icon: 'inv_weapon_shortblade_04', ap: 28, weapon: { min: 67, max: 125, speed: 2.4, type: 'Sword' },
                enchant: 'Crusader' },
  blackblade: { slot: 'Two hand',  name: 'Blackblade of Shahram',   q: 'epic', icon: 'inv_sword_29', weapon: { min: 166, max: 250, speed: 3.5, type: 'Sword', twoHand: true },
                enchant: 'Crusader', note: 'Its Shahram proc is not simulated' },
  bow:        { slot: 'Ranged',    name: "Satyr's Bow",             q: 'rare', icon: 'inv_weapon_bow_03', agi: 3, hitRating: 10 },
};
const gearList = keys => keys.map(k => ITEMS[k]);

const SPECS = {
  fury: {
    name: 'Fury', title: 'Fury Warrior', stance: 'berserker', preset: 'DPS Warrior',
    talents: {
      'Improved Heroic Strike': 2, 'Improved Rend': 3, 'Improved Tactical Mastery': 5, 'Improved Overpower': 2, 'Anger Management': 1, 'Deep Wounds': 3, 'Impale': 2,
      'Cruelty': 5, 'Lingering Rage': 3, 'Unbridled Wrath': 5, 'Furious Precision': 3, 'Dual Wield Specialization': 5, 'Raging Blows': 1, 'Improved Execute': 2,
      'Death Wish': 1, 'Flurry': 5, 'Bloodthirst': 1,
      'Improved Bloodrage': 2,
    },
    gear: gearList(['lionheart', 'jewel', 'truestrike', 'baron', 'savage', 'battleborn', 'deathgrips', 'girdle', 'woolies', 'bloodmail', 'elven', 'blackstone',
      'trinket', 'trinket', 'ironfoe', 'chorush', 'bow']),
    bar: ['bt', 'ww', 'hs', 'execute', 'overpower', 'hamstring', 'brage', 'bloodrage', 'dw', 'reck', 'potion'],
    keys: { bt: '1', ww: '2', hs: '3', execute: '4', overpower: '5', hamstring: '-', brage: '6', bloodrage: '7', dw: '8', reck: '9', potion: '0' },
    footer: 'WoW Forever dual wield fury in Berserker Stance against a level 63 boss.',
  },
  arms: {
    name: 'Arms', title: 'Arms Warrior', stance: 'battle', preset: 'Arms Warrior',
    talents: {
      'Improved Heroic Strike': 3, 'Improved Rend': 3, 'Improved Tactical Mastery': 5, 'Improved Overpower': 2, 'Anger Management': 1, 'Deep Wounds': 3,
      'Spearing Strike': 1, 'Two-Handed Weapon Specialization': 3, 'Impale': 2, 'Bloodthrill': 5, 'Sweeping Strikes': 1, 'Weaponmaster': 5, 'Improved Slam': 2, 'Mortal Strike': 1,
      'Booming Voice': 4, 'Cruelty': 5, 'Unbridled Wrath': 5,
    },
    gear: gearList(['lionheart', 'jewel', 'truestrike', 'baron', 'savage', 'battleborn', 'deathgrips', 'girdle', 'woolies', 'bloodmail', 'elven', 'blackstone',
      'trinket', 'trinket', 'blackblade', 'bow']),
    bar: ['ms', 'overpower', 'slam', 'rend', 'spearing', 'hs', 'execute', 'hamstring', 'bloodrage', 'reck', 'potion'],
    keys: { ms: '1', overpower: '2', slam: '3', rend: '4', spearing: '5', hs: '6', execute: '7', hamstring: '-', bloodrage: '8', reck: '9', potion: '0' },
    footer: 'WoW Forever two-handed arms in Battle Stance against a level 63 boss: keep Rend up, Mortal Strike and Overpower on cooldown, Slam and Spearing Strike when there is rage to spare.',
  },
};
let SPEC_ID = store.get('warriorSimSpec', 'fury');
if (!SPECS[SPEC_ID]) SPEC_ID = 'fury';
let SPEC = SPECS[SPEC_ID];
let GEAR = SPEC.gear;
const T = name => SPEC.talents[name] || 0;   // points in a talent

const gearSum = k => GEAR.reduce((n, g) => n + (g[k] || 0) + (g.ench?.[k] || 0), 0);
const STATS = { str: 0, agi: 0 };
const mhItem = () => GEAR.find(g => g.slot === 'Main hand' || g.slot === 'Two hand');
const ohItem = () => GEAR.find(g => g.slot === 'Off hand');
const twoHand = () => !!mhItem().weapon.twoHand;
const weaponmasterIs = types => T('Weaponmaster') && types.includes(mhItem().weapon.type);

// Unbuffed character-sheet stats from the gear list (talents included; stance bonuses are not)
function gearSheet() {
  const str = BASE.str + gearSum('str'), agi = BASE.agi + gearSum('agi');
  const mh = mhItem().weapon, oh = ohItem()?.weapon;
  return {
    str, agi,
    ap: BASE.ap + 2 * str + gearSum('ap'),   // 2 AP per Strength
    // 20 Agility per 1% crit, Cruelty, Weaponmaster with an axe or polearm, Human Sword Specialization with a sword equipped
    crit: +(agi / 20 + gearSum('critRating') / CRIT_RATING_PER_PCT + T('Cruelty') + (weaponmasterIs(['Axe', 'Polearm']) ? 5 : 0) +
      (BASE.race === 'Human' && GEAR.some(g => g.weapon?.type === 'Sword') ? 2 : 0)).toFixed(2),
    hit: gearSum('hitRating') / HIT_RATING_PER_PCT,
    mhMin: mh.min, mhMax: mh.max, mhSpeed: mh.speed, ohMin: oh ? oh.min : 0, ohMax: oh ? oh.max : 0, ohSpeed: oh ? oh.speed : 0,
  };
}
// Custom stats (Stats tab): when on, these replace the gear-derived sheet; buffs still apply on top. Kept per spec.
const CUSTOM_ALL = {};
for (const id of Object.keys(SPECS)) {
  const save = { SPEC_ID, SPEC, GEAR }; SPEC_ID = id; SPEC = SPECS[id]; GEAR = SPEC.gear;
  CUSTOM_ALL[id] = { on: false, ...gearSheet(), ...store.get('warriorSimCustomStats_' + id, {}) };
  ({ SPEC_ID, SPEC, GEAR } = save);
}
let CUSTOM = CUSTOM_ALL[SPEC_ID];

const CFG = {
  ap: 0, crit: 0, windfury: false,   // set by applySetup()
  hit: 0, mh: null, oh: null,        // set by applySetup()
  targetHp: 75000,     // dummy health; a fresh dummy appears when it dies
  executeRange: 0.2,   // Execute usable at or below 20% health
  bossArmor: 3731,     // level 63 boss, before debuffs
  armorMult: 1,        // damage multiplier after armor; set by applySetup()
  arthas: 0,           // flat damage added to physical hits; set by applySetup()
  chili: false,        // set by applySetup()
  chiliChance: 0.05, chiliCd: 10, chiliDamage: 60,   // Dragonbreath Chili: 60 damage is the Classic value

  // Level 60 vs level 63 boss, 300 weapon skill
  baseMiss: 9, dwMissPenalty: 19, dodge: 6.5,
  glanceChance: 40, glanceMult: 0.65, critSuppression: 4.8,

  // Forever normalized rage: white hits give rage from weapon speed, not damage
  ragePerSpeed: 3.46,      // rage per second of weapon speed (one-handed)
  twoHandRagePerSpeed: 4.5,// ...and two-handed
  offhandRageBase: 0.5,    // off-hand hits give half
  critRageMult: 2,         // crits give 100% more rage
  gcd: 1.5,
  refundOnAvoid: 0.8,
  // Talent-derived values, set by applySetup()
  offhandMult: 0.5, abilityCritMult: 2, unbridledWrath: 0, unbridledRage: 1, offhandRageMult: 1, offhandHit: 0, flurryHaste: 1,
  angerMgmt: false, angerMgmtInterval: 3, deepWounds: 0, twoHandMult: 1, hsCost: 15, executeCost: 15, wwCost: 25, impRend: 1,
  slamCast: 1.5, slamCd: 18, slamGcd: 1.5, bloodthrill: 0, weaponmasterExtra: 0, weaponmasterArmor: 0, bloodrageMult: 1, stanceRage: 10, overpowerCrit: 0,
  // Stances
  berserkerCrit: 3,        // Berserker Stance crit bonus
  stanceCd: 1,
  overpowerWindow: 5,      // seconds Overpower stays usable after a dodge
  bloodthrillWindow: 6,    // ...and after a Bloodthrill proc
  // Abilities (Forever tooltips)
  msBonus: 160, msCost: 30, msCd: 6,
  slamBonus: 87, slamCost: 15,
  rendCost: 10, rendTicks: 7, rendEvery: 3, rendTick: 64, rendApPerTick: 0.02,   // tick base fitted to MythicSim (the tooltip's 21 is far below their results)
  spearingMult: 0.4, spearingCost: 15, spearingCd: 20,
  overpowerBonus: 35, hsBonus: 157, executeBase: 600, executePerRage: 15, hamstringDamage: 45,
  // Gear procs
  ironfoeChance: 0.08,     // Ironfoe: chance on main hand hit for 2 extra attacks (fitted to MythicSim's extra swing count)
  crusaderPpm: 1,          // Crusader: procs per minute, per weapon
  crusaderAp: 200,         // Holy Strength: +100 Strength for 15 sec (set by applySetup())
  ragePotionAp: 120,       // Mighty Rage Potion: +60 Strength for 20 sec (set by applySetup())
  windfuryChance: 0.2,     // Windfury Totem: chance on main hand hit for 1 extra attack
  windfuryAp: 246,         // ...with this much extra attack power
};

// Setup toggles (WoW Forever values at level 60), shown in the panel on the left.
const RAID_BUFFS = [
  { id: 'shout', name: 'Battle Shout',              icon: 'ability_warrior_battleshout',        desc: '+139 attack power', on: true },
  { id: 'might', name: 'Greater Blessing of Might', icon: 'spell_holy_greaterblessingofkings',  desc: '+133 attack power', on: true },
  { id: 'kings', name: 'Greater Blessing of Kings', icon: 'spell_magic_greaterblessingofkings', desc: '+10% Strength and Agility', on: true },
  { id: 'gotw',  name: 'Gift of the Wild',          icon: 'spell_nature_regeneration',          desc: '+16 Strength and Agility', on: true },
  { id: 'lotp',  name: 'Leader of the Pack',        icon: 'spell_nature_unyeildingstamina',     desc: '+3% crit chance', on: true },
  { id: 'soe',   name: 'Strength of Earth Totem',   icon: 'spell_nature_earthbindtotem',        desc: '+53 Strength', on: true },
  { id: 'goa',   name: 'Grace of Air Totem',        icon: 'spell_nature_invisibilitytotem',     desc: '+89 Agility', on: true },
  { id: 'wf',    name: 'Windfury Totem',            icon: 'spell_nature_windfury',              desc: 'Main hand hits: 20% chance for an extra attack with +246 attack power', on: true },
];
const CONSUMABLES = [
  { id: 'mongoose',  name: 'Elixir of the Mongoose',      icon: 'inv_potion_32',             desc: '+25 Agility, +2% crit chance', on: true },
  { id: 'jujupower', name: 'Juju Power',                  icon: 'inv_misc_monsterscales_11', desc: '+30 Strength', on: true },
  { id: 'jujumight', name: 'Juju Might',                  icon: 'inv_misc_monsterscales_07', desc: '+40 attack power', on: true },
  { id: 'roids',     name: 'R.O.I.D.S.',                  icon: 'inv_stone_15',              desc: '+25 Strength', on: true },
  { id: 'dumplings', name: 'Smoked Desert Dumplings',     icon: 'inv_misc_food_64',          desc: '+20 Strength', on: true },
  { id: 'stones',    name: 'Elemental Sharpening Stones', icon: 'inv_stone_02',              desc: '+2% crit chance per weapon', on: true },
  { id: 'chili',     name: 'Dragonbreath Chili',          icon: 'inv_drink_17',              desc: 'Melee hits: 5% chance to deal 60 fire damage (10 sec cooldown)', on: true },
];
const BOSS_DEBUFFS = [
  { id: 'sunder', name: 'Sunder Armor / Expose Armor', icon: 'ability_warrior_sunder',       desc: '-2250 armor (the two do not stack)', on: true },
  { id: 'ff',     name: 'Faerie Fire',                 icon: 'spell_nature_faeriefire',      desc: '-505 armor', on: true },
  { id: 'cor',    name: 'Curse of Recklessness',       icon: 'spell_shadow_unholystrength',  desc: '-505 armor', on: true },
  { id: 'arthas', name: 'Gift of Arthas',              icon: 'spell_nature_nullifydisease',  desc: '+8 physical damage taken per hit', on: true },
];
const TOGGLE_GROUPS = [
  { title: 'Raid buffs', items: RAID_BUFFS },
  { title: 'Consumables', items: CONSUMABLES },
  { title: 'Boss debuffs', items: BOSS_DEBUFFS },
];
const ALL_TOGGLES = TOGGLE_GROUPS.flatMap(g => g.items);

function applySetup() {
  const on = id => ALL_TOGGLES.find(b => b.id === id).on;
  const mult = on('kings') ? 1.1 : 1;
  const str = (on('gotw') ? 16 : 0) + (on('soe') ? 53 : 0) + (on('jujupower') ? 30 : 0) + (on('roids') ? 25 : 0) + (on('dumplings') ? 20 : 0);
  const agi = (on('gotw') ? 16 : 0) + (on('goa') ? 89 : 0) + (on('mongoose') ? 25 : 0);
  const sheet = CUSTOM.on ? CUSTOM : gearSheet();
  STATS.str = Math.round((sheet.str + str) * mult);
  STATS.agi = Math.round((sheet.agi + agi) * mult);
  // Buffs add on top of the sheet: 2 AP per Strength gained, 1% crit per 20 Agility gained
  CFG.ap = Math.round(sheet.ap + 2 * (STATS.str - sheet.str) + (on('shout') ? BATTLE_SHOUT_AP : 0) + (on('might') ? 133 : 0) + (on('jujumight') ? 40 : 0));
  CFG.crit = sheet.crit + (STATS.agi - sheet.agi) / 20 +
    (on('lotp') ? 3 : 0) + (on('mongoose') ? 2 : 0) + (on('stones') ? (sheet.ohSpeed ? 4 : 2) : 0);
  CFG.hit = sheet.hit;
  CFG.mh = { min: sheet.mhMin, max: sheet.mhMax, speed: sheet.mhSpeed };
  CFG.oh = sheet.ohSpeed ? { min: sheet.ohMin, max: sheet.ohMax, speed: sheet.ohSpeed } : null;
  CFG.crusaderAp = Math.round(200 * mult);
  CFG.ragePotionAp = Math.round(120 * mult);
  CFG.windfury = on('wf');
  CFG.chili = on('chili');
  // Boss armor after debuffs; damage reduction = armor / (armor + 400 + 85 * attacker level)
  CFG.targetArmor = Math.max(0, CFG.bossArmor - (on('sunder') ? 2250 : 0) - (on('ff') ? 505 : 0) - (on('cor') ? 505 : 0));
  CFG.armorMult = 1 - CFG.targetArmor * (1 - CFG.weaponmasterArmor) / (CFG.targetArmor * (1 - CFG.weaponmasterArmor) + 400 + 85 * 60);
  CFG.arthas = on('arthas') ? 8 : 0;
  // Talents
  CFG.offhandMult = 0.5 * (1 + 0.05 * T('Dual Wield Specialization'));
  CFG.abilityCritMult = 2 + 0.1 * T('Impale');
  CFG.unbridledWrath = 0.12 * T('Unbridled Wrath');
  CFG.unbridledRage = twoHand() ? 2 : 1;
  CFG.offhandRageMult = 1 + 0.1 * T('Dual Wield Specialization');
  CFG.offhandHit = T('Furious Precision') * 10 / 3;
  CFG.flurryHaste = 1 + 0.05 * T('Flurry');
  CFG.angerMgmt = T('Anger Management') > 0;
  CFG.deepWounds = 0.2 * T('Deep Wounds');
  CFG.twoHandMult = twoHand() ? 1 + 0.01 * T('Two-Handed Weapon Specialization') : 1;
  CFG.hsCost = 15 - T('Improved Heroic Strike');
  CFG.executeCost = 15 - 2.5 * T('Improved Execute');
  CFG.wwCost = 25 - 3 * T('Raging Blows');
  CFG.impRend = 1 + 0.35 / 3 * T('Improved Rend');
  CFG.slamCast = 1.5 - 0.25 * T('Improved Slam');
  CFG.slamGcd = 1.5 - 0.25 * T('Improved Slam');
  CFG.slamCd = 18 - 1.5 * T('Improved Slam');
  CFG.bloodthrill = 0.04 * T('Bloodthrill');
  CFG.weaponmasterExtra = weaponmasterIs(['Sword']) ? 0.01 * T('Weaponmaster') : 0;
  CFG.weaponmasterArmor = weaponmasterIs(['Mace', 'Staff']) ? 0.03 * T('Weaponmaster') : 0;
  CFG.bloodrageMult = 1 + 0.25 * T('Improved Bloodrage');
  CFG.stanceRage = 10 + 3 * T('Improved Tactical Mastery');
  CFG.overpowerCrit = 25 * T('Improved Overpower');
}
applySetup();


// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
const newState = () => ({
  t: 0, rage: 0, gcdUntil: 0, queued: null, cast: null,
  ready: {}, buffs: { dw: 0, reck: 0, brage: 0, crusMH: 0, crusOH: 0, potion: 0 },
  flurry: 0, mhProg: 0, ohProg: 0.5,
  amTimer: 0, bloodrageTicks: 0, bloodrageNext: 0,
  woundTicks: 0, woundNext: 0, woundTickDmg: 0,
  rendTicks: 0, rendNext: 0, rendTickDmg: 0,
  stance: SPEC.stance, stanceReady: 0, returnStance: null, overpowerUntil: 0, chiliReady: 0,
  totalDamage: 0, hp: CFG.targetHp, started: false, over: false,
  stats: {}, rageGained: 0, rageWasted: 0,   // fight overview
});
const S = newState();
const statFor = name => S.stats[name] ??= { dmg: 0, hits: 0, crits: 0, avoided: 0 };

const rand = (a, b) => a + Math.random() * (b - a);
const addRage = n => {
  const gained = Math.min(n, 100 - S.rage);
  S.rage += gained; S.rageGained += gained; S.rageWasted += n - gained;
};
const damageMult = () => CFG.armorMult * CFG.twoHandMult * (S.t < S.buffs.dw ? 1.2 : 1);
const critChance = () => Math.max(0, CFG.crit - CFG.critSuppression + (S.stance === 'berserker' ? CFG.berserkerCrit : 0)) +
  (S.t < S.buffs.reck ? 100 : 0);
const ap = () => CFG.ap + CFG.crusaderAp * ((S.t < S.buffs.crusMH) + (S.t < S.buffs.crusOH)) +
  (S.t < S.buffs.potion ? CFG.ragePotionAp : 0);
const weaponRoll = (w, speedForAp) => rand(w.min, w.max) + ap() / 14 * (speedForAp ?? w.speed);
const normalizedSpeed = () => twoHand() ? 3.3 : 2.4;
const rendActive = () => S.rendTicks > 0;

// ---------------------------------------------------------------------------
// Attack tables
// ---------------------------------------------------------------------------
function rollWhite(isOffhand) {
  const miss = Math.max(0, CFG.baseMiss + (CFG.oh ? CFG.dwMissPenalty : 0) - CFG.hit - (isOffhand ? CFG.offhandHit : 0));
  let r = Math.random() * 100;
  if ((r -= miss) < 0) return 'miss';
  if ((r -= CFG.dodge) < 0) return 'dodge';
  if ((r -= CFG.glanceChance) < 0) return 'glance';
  if ((r -= critChance()) < 0) return 'crit';
  return 'hit';
}

function rollYellow(opts = {}) {
  const miss = Math.max(0, CFG.baseMiss - CFG.hit);
  const r = Math.random() * 100;
  if (r < miss) return 'miss';
  if (!opts.noDodge && r < miss + CFG.dodge) return 'dodge';
  if (opts.noCrit) return 'hit';
  return Math.random() * 100 < critChance() + (opts.critBonus || 0) ? 'crit' : 'hit';
}

// ---------------------------------------------------------------------------
// Attacks
// ---------------------------------------------------------------------------
function damageTarget(name, dmg, crit) {
  dmg = Math.min(dmg, Math.ceil(S.hp));
  S.totalDamage += dmg;
  S.hp -= dmg;
  const st = statFor(name);
  st.dmg += dmg; st.hits++; if (crit) st.crits++;
  if (S.hp <= 0) endFight();
  return dmg;
}

function deal(name, dmg, crit, cls, noFlurry) {
  if (S.over) return 0;
  dmg = damageTarget(name, Math.round(dmg), crit);
  floater(dmg + (crit ? '!' : ''), cls + (crit ? ' crit' : ''));
  log(`<span class="${cls === 'yellow' ? 'y' : 'w'}">${name} ${crit ? 'crits' : 'hits'} for ${dmg}.</span>`);
  if (crit) {
    if (!noFlurry && T('Flurry')) S.flurry = 3;
    // Deep Wounds: each crit adds 60% of the main hand's average weapon damage (no attack power),
    // rolled together with whatever the running bleed still owed, over 4 ticks
    if (CFG.deepWounds) {
      const owed = S.woundTicks * S.woundTickDmg;
      S.woundTickDmg = (owed + CFG.deepWounds * (CFG.mh.min + CFG.mh.max) / 2) / 4;
      S.woundTicks = 4; S.woundNext = S.t + 3;
    }
  }
  targetEl.classList.remove('hit'); void targetEl.offsetWidth; targetEl.classList.add('hit');
  return dmg;
}

function avoided(name, res) {
  if (S.over) return;
  statFor(name).avoided++;
  const word = res === 'miss' ? 'Miss' : 'Dodge';
  if (res === 'dodge') S.overpowerUntil = Math.max(S.overpowerUntil, S.t + CFG.overpowerWindow);
  floater(word, 'avoid');
  log(`${name}: ${word.toLowerCase()}.`);
}

// Weapon procs on a landed hit. allowExtra: extra attacks (Windfury, Ironfoe, Weaponmaster) do not trigger more extra attacks.
function weaponProcs(isOffhand, allowExtra) {
  if (CFG.chili && S.t >= S.chiliReady && !S.over && Math.random() < CFG.chiliChance) {
    S.chiliReady = S.t + CFG.chiliCd;
    const dmg = damageTarget('Dragonbreath Chili', CFG.chiliDamage, false);
    floater(dmg, 'yellow bleed');
    log(`<span class="y">Dragonbreath Chili hits for ${dmg}.</span>`);
  }
  const w = isOffhand ? CFG.oh : CFG.mh;
  if (Math.random() < CFG.crusaderPpm * w.speed / 60) {
    S.buffs[isOffhand ? 'crusOH' : 'crusMH'] = S.t + 15;
    log('<span class="r">You gain Holy Strength.</span>');
  }
  // Bloodthrill: main hand hits on a target with your Rend can enable Overpower
  if (!isOffhand && CFG.bloodthrill && rendActive() && Math.random() < CFG.bloodthrill) {
    if (S.t >= S.overpowerUntil) log('<span class="r">Bloodthrill: Overpower is ready.</span>');
    S.overpowerUntil = Math.max(S.overpowerUntil, S.t + CFG.bloodthrillWindow);
  }
  if (!isOffhand && allowExtra && mhItem().name === 'Ironfoe' && Math.random() < CFG.ironfoeChance) {
    log('<span class="r">Ironfoe grants 2 extra attacks.</span>');
    whiteAttack(false, 'Ironfoe');
    whiteAttack(false, 'Ironfoe');
  }
  if (!isOffhand && allowExtra && CFG.weaponmasterExtra && Math.random() < CFG.weaponmasterExtra) {
    log('<span class="r">Weaponmaster grants an extra attack.</span>');
    whiteAttack(false, 'Weaponmaster');
  }
  if (!isOffhand && allowExtra && CFG.windfury && Math.random() < CFG.windfuryChance) {
    log('<span class="r">Windfury grants an extra attack.</span>');
    whiteAttack(false, 'Windfury', CFG.windfuryAp);
  }
}

// Special attack. `cost` has already been paid; part is refunded if avoided.
function yellowAttack(name, base, cost, refund, isOffhand = false, opts) {
  const res = rollYellow(opts);
  if (res === 'miss' || res === 'dodge') {
    avoided(name, res);
    if (refund) addRage(cost * CFG.refundOnAvoid);
    return false;
  }
  const crit = res === 'crit';
  deal(name, base * damageMult() * (crit ? CFG.abilityCritMult : 1) + CFG.arthas, crit, 'yellow', opts?.noFlurry);
  if (opts?.swing) {
    if (!crit && S.flurry > 0) S.flurry--;
    if (Math.random() < CFG.unbridledWrath) addRage(CFG.unbridledRage);
  }
  weaponProcs(isOffhand, true);
  return true;
}

function whiteAttack(isOffhand, extra = false, bonusAp = 0) {
  const w = isOffhand ? CFG.oh : CFG.mh;
  const name = isOffhand ? 'Off hand' : extra ? `Main hand (${extra})` : 'Main hand';
  const res = rollWhite(isOffhand);
  if (res === 'miss' || res === 'dodge') return avoided(name, res);
  let dmg = (weaponRoll(w) + bonusAp / 14 * w.speed) * (isOffhand ? CFG.offhandMult : 1) * damageMult();
  if (res === 'glance') dmg *= CFG.glanceMult;
  if (res === 'crit') dmg *= 2;
  dmg = deal(name, dmg + CFG.arthas, res === 'crit', 'white');
  if (res !== 'crit' && S.flurry > 0) S.flurry--;
  // Glancing blows give full rage; misses and dodges (returned above) give none
  addRage((twoHand() ? CFG.twoHandRagePerSpeed : CFG.ragePerSpeed) * w.speed * (isOffhand ? CFG.offhandRageBase * CFG.offhandRageMult : 1) *
    (res === 'crit' ? CFG.critRageMult : 1));
  if (Math.random() < CFG.unbridledWrath) addRage(CFG.unbridledRage);
  weaponProcs(isOffhand, !extra);
}

function mainHandSwing() {
  const q = S.queued && ABILITY[S.queued];
  S.queued = null;
  if (q && S.rage >= q.cost()) {
    S.rage -= q.cost();
    yellowAttack(q.name, weaponRoll(CFG.mh) + q.bonus, q.cost(), true, false, { swing: true });
  } else {
    whiteAttack(false);
  }
}

function offHandSwing() {
  whiteAttack(true);
}

    desc: 'Next main hand swing deals +157 damage. Cost reduced by Improved Heroic Strike. Press again to cancel.' },

    } },

    desc: 'Deals 45 damage. Cheap instant attack that can trigger weapon procs, Flurry, Deep Wounds and Bloodthrill.',
    use() { yellowAttack(this.name, CFG.hamstringDamage, this.cost(), true); } },

    desc: 'Fear immunity and extra rage when taking damage for 10 sec. Generates no rage here: Improved Berserker Rage is not taken and you take no damage.',
    use() { S.buffs.brage = S.t + 10; log('<span class="r">You gain Berserker Rage.</span>'); } },
  { id: 'bloodrage', name: 'Bloodrage', icon: 'ability_racial_bloodrage', cost: () => 0, cd: 60,
    desc: 'Generates 10 rage instantly and 10 more over 10 sec, 50% more with Improved Bloodrage. Not on the global cooldown.',
    use() { gainRage(Math.round(10 * CFG.bloodrageMult), this.name); S.bloodrageTicks = 10; S.bloodrageNext = S.t + 1; } },

    desc: '+20% physical damage for 30 sec.',

    desc: '+100% crit chance for 15 sec. 30 min cooldown. Requires Berserker Stance.',
    use() { S.buffs.reck = S.t + 15; log('<span class="r">You gain Recklessness.</span>'); } },
  { id: 'potion', name: 'Mighty Rage Potion', icon: 'inv_potion_41', cost: () => 0, cd: 120,
    desc: 'Generates 45 to 75 rage and gives +60 Strength for 20 sec. 2 min cooldown. Not on the global cooldown.',
    use() { S.buffs.potion = S.t + 20; gainRage(Math.round(rand(45, 75)), this.name); } },

const ABILITY = Object.fromEntries(ABILITIES.map(a => [a.id, a]));
const barAbilities = () => SPEC.bar.map(id => ABILITY[id]);
const cdOf = a => a.id === 'slam' ? CFG.slamCd : a.cd;

function gainRage(n, name) {
  addRage(n);
  floater(`+${n} Rage`, 'rage');
  log(`<span class="r">${name}: +${n} rage.</span>`);
}

function setStance(stance) {
  S.returnStance = null;
  S.stance = stance;
  S.stanceReady = S.t + CFG.stanceCd;
  const lost = Math.max(0, S.rage - CFG.stanceRage);
  S.rage -= lost; S.rageWasted += lost;
  const name = stance === 'battle' ? 'Battle Stance' : 'Berserker Stance';
  floater(name, 'rage');
  log(`<span class="r">You enter ${name}${lost >= 1 ? ` and lose ${Math.round(lost)} rage` : ''}.</span>`);
}

function press(a) {
  if (!S.started || S.over) return;
  const cost = a.cost();
  if (a.queue) {
    if (S.queued === a.id) S.queued = null;
    else if (S.rage >= cost) S.queued = a.id;
    else deny(a);
    return;
  }
  // Abilities that need another stance switch to it automatically (rage above the kept amount is lost)
  const swap = a.stance && a.stance !== S.stance;
  const rage = swap ? Math.min(S.rage, CFG.stanceRage) : S.rage;
  if (S.cast || S.t < (S.ready[a.id] || 0) || (a.gcd && S.t < S.gcdUntil) || rage < cost || (a.usable && !a.usable()) ||
      (swap && S.t < S.stanceReady)) return deny(a);
  const from = S.stance;
  if (swap) setStance(a.stance);
  // Overpower flips back to the stance it came from as soon as the stance cooldown allows
  if (swap && a.returnStance) S.returnStance = from;
  S.rage -= cost;
  S.ready[a.id] = S.t + cdOf(a);
  if (a.cast) {
    // Slam: the damage lands when the cast finishes
    S.gcdUntil = S.t + CFG.slamGcd;
    S.cast = { ability: a, until: S.t + CFG.slamCast, total: CFG.slamCast };
    return;
  }
  if (a.gcd) S.gcdUntil = S.t + CFG.gcd;
  a.use();
}

function deny(a) {
  if (!a.el) return;
  a.el.classList.remove('denied'); void a.el.offsetWidth; a.el.classList.add('denied');
}

// ---------------------------------------------------------------------------
// Simulation tick
// ---------------------------------------------------------------------------
function tick(dt) {
  S.t += dt;

  if (S.returnStance && S.t >= S.stanceReady) setStance(S.returnStance);

  if (S.cast && S.t >= S.cast.until) { const a = S.cast.ability; S.cast = null; a.use(); }

  if (CFG.angerMgmt) {
    S.amTimer += dt;
    while (S.amTimer >= CFG.angerMgmtInterval) { S.amTimer -= CFG.angerMgmtInterval; addRage(1); }
  }

  while (S.bloodrageTicks > 0 && S.t >= S.bloodrageNext) {
    addRage(CFG.bloodrageMult); S.bloodrageTicks--; S.bloodrageNext += 1;
  }

  // Deep Wounds bleed tick: ignores armor and damage modifiers
  while (S.woundTicks > 0 && S.t >= S.woundNext && !S.over) {
    const dmg = Math.round(S.woundTickDmg);
    S.woundTicks--; S.woundNext += 3;
    damageTarget('Deep Wounds', dmg, false);
    floater(dmg, 'white bleed');
    log(`<span class="w">Deep Wounds ticks for ${dmg}.</span>`);
  }
  // Rend bleed tick: ignores armor, can crit
  while (S.rendTicks > 0 && S.t >= S.rendNext && !S.over) {
    const crit = Math.random() * 100 < critChance();
    const dmg = Math.round(S.rendTickDmg * (crit ? 1.5 : 1));
    S.rendTicks--; S.rendNext += CFG.rendEvery;
    damageTarget('Rend', dmg, crit);
    floater(dmg + (crit ? '!' : ''), 'white bleed' + (crit ? ' crit' : ''));
    log(`<span class="w">Rend ${crit ? 'crits' : 'ticks'} for ${dmg}.</span>`);
  }

  const haste = S.flurry > 0 ? CFG.flurryHaste : 1;
  S.mhProg += dt * haste / CFG.mh.speed;
  if (S.mhProg >= 1) { S.mhProg -= 1; mainHandSwing(); }
  if (CFG.oh) {
    S.ohProg += dt * haste / CFG.oh.speed;
    if (S.ohProg >= 1) { S.ohProg -= 1; offHandSwing(); }
  }
}

// ---------------------------------------------------------------------------
// UI
// ---------------------------------------------------------------------------
let last = performance.now();
const $ = id => document.getElementById(id);
const arenaEl = $('arena'), targetEl = $('target'), logEl = $('log');

const iconUrl = name => `https://wow.zamimg.com/images/wow/icons/large/${name}.jpg`;

function floater(text, cls) {
  if (!arenaEl.offsetParent) return;   // combat tab hidden
  const el = document.createElement('div');
  el.className = 'floater ' + cls;
  el.textContent = text;
  el.style.left = rand(25, 75) + '%';
  el.style.top = rand(35, 55) + '%';
  el.addEventListener('animationend', () => el.remove());
  arenaEl.appendChild(el);
}

function log(html) {
  const el = document.createElement('div');
  el.innerHTML = html;
  logEl.appendChild(el);
  while (logEl.children.length > 8) logEl.firstChild.remove();
}

function fmtTime(s) {
  if (s >= 60) return Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  return s >= 10 ? Math.ceil(s) : s.toFixed(1);
}

function buildBar() {
  $('bar').innerHTML = '';
  for (const a of ABILITIES) a.el = null;
  for (const a of barAbilities()) {
    const el = document.createElement('button');
    el.className = 'ability';
    const cd = cdOf(a);
    el.title = `${a.name}\n${a.cost() ? a.cost() + ' rage' : 'No cost'}${cd ? ' · ' + fmtTime(cd) + (cd >= 60 ? ' min' : ' sec') + ' cooldown' : ''}\n${a.desc}`;
    el.style.backgroundImage = `url(${iconUrl(a.icon)})`;
    el.innerHTML = `<span class="key"></span>` +
      (a.cost() ? `<span class="cost">${a.cost()}</span>` : '') +
      `<div class="cdmask"></div><div class="cdtext"></div>`;
    el.addEventListener('click', () => { if (rebinding) selectRebind(a); else press(a); });
    a.el = el; a.mask = el.querySelector('.cdmask'); a.cdText = el.querySelector('.cdtext');
    a.keyEl = el.querySelector('.key'); a.defaultKey = SPEC.keys[a.id] || '';
    const slot = document.createElement('div');
    slot.className = 'slot';
    slot.append(el, a.name);
    $('bar').appendChild(slot);
  }
}

// --- Fight overview and reset ---
// Display name and icon for each damage source in the end-of-fight table
function sourceInfo(name) {
  const ability = ABILITIES.find(x => x.name === name);
  if (ability) return { label: name, icon: ability.icon };
  const mhIcon = mhItem().icon, ohIcon = ohItem()?.icon;
  return {
    'Main hand': { label: 'Melee', icon: mhIcon },
    'Off hand': { label: 'Melee (Off Hand)', icon: ohIcon },
    'Main hand (Windfury)': { label: 'Windfury Attack', icon: 'spell_nature_windfury' },
    'Main hand (Ironfoe)': { label: 'Ironfoe (Extra Attack)', icon: mhIcon },
    'Main hand (Weaponmaster)': { label: 'Weaponmaster (Extra Attack)', icon: 'garrison_weaponupgrade' },
    'Whirlwind (off hand)': { label: 'Whirlwind (Off Hand)', icon: 'ability_whirlwind' },
    'Deep Wounds': { label: 'Deep Wounds', icon: 'ability_backstab' },
    'Dragonbreath Chili': { label: 'Dragonbreath Chili', icon: 'inv_drink_17' },
  }[name] || { label: name, icon: 'inv_misc_questionmark' };
}

// Damage Done table laid out like a Warcraft Logs report
function endFight() {
  S.over = true;
  S.hp = 0;
  S.cast = null;
  const n = v => Math.round(v).toLocaleString();
  const pct = (x, of) => of ? (x / of * 100).toFixed(1) + '%' : '-';
  const sources = Object.entries(S.stats).sort((x, y) => y[1].dmg - x[1].dmg);
  const top = sources.length ? sources[0][1].dmg : 1;
  let casts = 0, hits = 0, crits = 0, avoided = 0;
  const rows = sources.map(([name, st]) => {
    const info = sourceInfo(name);
    const isDot = name === 'Deep Wounds' || name === 'Rend';
    const stCasts = st.hits + st.avoided;
    if (!isDot) { casts += stCasts; avoided += st.avoided; }
    hits += st.hits; crits += st.crits;
    return `<tr><td class="wcl-name"><img src="${iconUrl(info.icon)}" alt="">${info.label}</td>` +
      `<td class="wcl-amount"><span class="wcl-pct">${pct(st.dmg, S.totalDamage)}</span>` +
      `<span class="wcl-bar"><i style="width:${st.dmg / top * 100}%"></i></span><span class="wcl-total">${n(st.dmg)}</span></td>` +
      `<td class="num">${isDot ? '-' : stCasts}</td><td class="num">${isDot || !stCasts ? '-' : n(st.dmg / stCasts)}</td>` +
      `<td class="num">${st.hits}</td><td class="num">${st.hits ? n(st.dmg / st.hits) : '-'}</td>` +
      `<td class="num">${name === 'Deep Wounds' ? '-' : pct(st.crits, st.hits)}</td><td class="num">${isDot ? '-' : pct(st.avoided, stCasts)}</td>` +
      `<td class="num">${(st.dmg / S.t).toFixed(1)}</td></tr>`;
  }).join('');
  $('summary-body').innerHTML =
    `<div class="wcl-meta">Fight length <b>${fmtTime(S.t)}</b> · Rage gained <b>${Math.round(S.rageGained)}</b> · ` +
    `Rage lost (cap and stance changes) <b>${Math.round(S.rageWasted)}</b></div>` +
    `<table class="wcl"><tr><th>Name</th><th>Amount</th><th class="num">Casts</th><th class="num">Avg Cast</th>` +
    `<th class="num">Hits</th><th class="num">Avg Hit</th><th class="num">Crit %</th><th class="num">Miss %</th><th class="num">DPS</th></tr>` +
    rows +
    `<tr class="wcl-totalrow"><td>Total</td><td class="wcl-amount"><span class="wcl-pct">100%</span><span class="wcl-bar"></span>` +
    `<span class="wcl-total">${n(S.totalDamage)}</span></td><td class="num">${casts}</td><td class="num">-</td>` +
    `<td class="num">${hits}</td><td class="num">-</td><td class="num">${pct(crits, hits)}</td><td class="num">${pct(avoided, casts)}</td>` +
    `<td class="num">${(S.totalDamage / S.t).toFixed(1)}</td></tr></table>`;
  $('summary').classList.add('show');
}

function reset() {
  Object.assign(S, newState());
  $('hpinput').value = CFG.targetHp;
  logEl.innerHTML = '';

// --- Keybinds: editable, saved in this browser, separately for each spec ---
const keyStore = () => 'warriorSimKeybinds_' + SPEC_ID;
let rebinding = false, rebindTarget = null;
// Browser shortcuts a page cannot take over: binding them would close or open tabs instead of using the ability
const RESERVED_KEYS = ['Ctrl+w', 'Ctrl+t', 'Ctrl+n', 'Ctrl+Shift+w', 'Ctrl+Shift+t', 'Ctrl+Shift+n'];
const RESERVED_NOTE = 'Ctrl+W, Ctrl+T and Ctrl+N belong to the browser and cannot be used.';
// A binding is the physical key plus optional Ctrl / Shift, e.g. "q", "Shift+1", "Ctrl+Shift+e".
// The base key comes from e.code so Shift+1 stays "1" instead of becoming "!".
const CODE_KEYS = {
  Minus: '-', Equal: '=', BracketLeft: '[', BracketRight: ']', Backquote: '`', Semicolon: ';', Quote: "'",
  Comma: ',', Period: '.', Slash: '/', Backslash: '\\', Space: ' ',
};
function baseKey(e) {
  const c = e.code || '';
  if (/^Digit\d$/.test(c)) return c.slice(5);
  if (/^Key[A-Z]$/.test(c)) return c.slice(3).toLowerCase();
  if (/^Numpad\d$/.test(c)) return 'Num' + c.slice(6);
  if (CODE_KEYS[c]) return CODE_KEYS[c];
  return e.key.length === 1 ? e.key.toLowerCase() : e.key;
}
const normKey = e => (e.ctrlKey ? 'Ctrl+' : '') + (e.shiftKey ? 'Shift+' : '') + baseKey(e);
function keyLabel(k) {
  if (!k) return '';
  const parts = k.split(/\+(?=.)/);          // keeps a trailing "+" key intact
  const base = parts.pop();
  const mods = parts.map(m => m[0]).join('');  // Ctrl -> C, Shift -> S
  const name = base === ' ' ? 'Spc' : base.length === 1 ? base.toUpperCase() : base.replace('Arrow', '').slice(0, 4);
  return (mods ? mods + '-' : '') + name;
}

function showKeys() {
  for (const a of barAbilities()) a.keyEl.textContent = keyLabel(a.key);
}
function saveKeys() {
  store.set(keyStore(), Object.fromEntries(barAbilities().map(a => [a.id, a.key])));
}
function loadKeys() {
  const saved = store.get(keyStore(), {});
  for (const a of barAbilities()) a.key = typeof saved[a.id] === 'string' ? saved[a.id] : a.defaultKey;
  showKeys();
}
function selectRebind(a) {
  rebindTarget = a;
  for (const b of barAbilities()) b.el.classList.toggle('rebind-target', b === a);
  $('rebind-hint').classList.remove('warn');
  $('rebind-hint').textContent = a ? `Press a key for ${a.name}, with Shift or Ctrl if you like (Esc to cancel). ${RESERVED_NOTE}`
    : `Click an ability, then press the key you want. ${RESERVED_NOTE}`;
}
function setRebinding(on) {
  rebinding = on;
  $('bar').classList.toggle('editing', on);
  $('keybar').classList.toggle('editing', on);
  $('rebind').classList.toggle('active', on);
  $('rebind').textContent = on ? 'Done' : 'Change keybinds';
  selectRebind(null);
  if (!on) $('rebind-hint').textContent = '';
}
$('rebind').addEventListener('click', () => setRebinding(!rebinding));
$('rebind-reset').addEventListener('click', () => {
  for (const a of barAbilities()) a.key = a.defaultKey;
  saveKeys(); showKeys(); selectRebind(null);
});

document.addEventListener('keydown', e => {
  if (e.repeat || e.altKey || e.metaKey || e.target.tagName === 'INPUT') return;
  if (['Shift', 'Control', 'Alt', 'Meta', 'Tab', 'CapsLock'].includes(e.key)) return;
  const key = normKey(e);
  if (rebinding) {
    e.preventDefault();
    if (e.key === 'Escape') return rebindTarget ? selectRebind(null) : setRebinding(false);
    if (!rebindTarget) return;
    if (RESERVED_KEYS.includes(key)) {
      $('rebind-hint').classList.add('warn');
      $('rebind-hint').textContent = `${key.replace(/[a-z]$/, c => c.toUpperCase())} is a browser shortcut and cannot be bound. Pick another key for ${rebindTarget.name}.`;
      return;
    }
    // A key can only be bound to one ability: take it away from whichever had it
    for (const a of barAbilities()) if (a.key === key) a.key = '';
    rebindTarget.key = key;
    saveKeys(); showKeys(); selectRebind(null);
    return;
  }
  const a = barAbilities().find(a => a.key && a.key === key);
  if (a) { e.preventDefault(); press(a); }
});

// --- Spec switch ---
function setSpec(id) {
  SPEC_ID = id; SPEC = SPECS[id]; GEAR = SPEC.gear; CUSTOM = CUSTOM_ALL[id];
  store.set('warriorSimSpec', id);
  applySetup();
  if (rebinding) setRebinding(false);
  buildBar(); loadKeys();
  reset();
  document.querySelectorAll('#specbar button').forEach(b => b.classList.toggle('active', b.dataset.spec === id));
  document.querySelector('h1').textContent = `WoW Forever — ${SPEC.title} (60)`;
  document.title = `WoW Forever ${SPEC.title} Simulator`;
  $('ohswing').style.display = CFG.oh ? '' : 'none';
  $('footer').textContent = `${SPEC.footer} Press Start fight, then use the keys shown on the buttons, or click, to use abilities. See the Gear and Talents tabs for the setup.`;
  renderGearTab(); renderTalentsTab(); fillStatsTab(); renderResultStats();
}
document.querySelectorAll('#specbar button').forEach(b => b.addEventListener('click', () => { if (b.dataset.spec !== SPEC_ID) setSpec(b.dataset.spec); }));
setSpec(SPEC_ID);

function render() {
  arenaEl.classList.toggle('idle', !S.started);
  document.querySelectorAll('.stance').forEach(btn => btn.classList.toggle('active', btn.dataset.stance === S.stance));
  const hpPct = S.hp / CFG.targetHp * 100;
  $('hpfill').style.width = hpPct + '%';
  $('hpbar').classList.toggle('execute', S.hp <= CFG.targetHp * CFG.executeRange);
  $('hptext').textContent = `${Math.ceil(S.hp).toLocaleString()} / ${CFG.targetHp.toLocaleString()} (${Math.ceil(hpPct)}%)`;
  $('ragefill').style.width = S.rage + '%';
  $('ragetext').textContent = Math.floor(S.rage) + ' / 100';
  $('mhbar').style.width = S.mhProg * 100 + '%';
  $('ohbar').style.width = (CFG.oh ? S.ohProg * 100 : 0) + '%';
  $('castbar').style.width = S.cast ? Math.min(1, 1 - (S.cast.until - S.t) / S.cast.total) * 100 + '%' : '0';
  $('casttext').textContent = S.cast ? `${S.cast.ability.name} ${fmtTime(Math.max(0, S.cast.until - S.t))}` : '';

  for (const a of barAbilities()) {
    const cdLeft = (S.ready[a.id] || 0) - S.t;
    const gcdLeft = a.gcd ? S.gcdUntil - S.t : 0;
    let frac = 0;
    if (cdLeft > 0 && cdLeft >= gcdLeft) frac = cdLeft / cdOf(a);
    else if (gcdLeft > 0) frac = gcdLeft / CFG.gcd;
    a.mask.style.height = frac * 100 + '%';
    a.cdText.textContent = cdLeft > 0 ? fmtTime(cdLeft) : '';
    a.el.classList.toggle('norage', !S.started || S.rage < a.cost() || !!(a.usable && !a.usable()));
    a.el.classList.toggle('queued', S.queued === a.id);
    if (a.proc) a.el.classList.toggle('proc', S.started && a.usable());
  }

  const buffs = [];
  if (S.t < S.buffs.reck) buffs.push(['ability_criticalstrike', `Recklessness ${fmtTime(S.buffs.reck - S.t)}`]);
  if (S.t < S.buffs.dw) buffs.push(['spell_shadow_deathpact', `Death Wish ${fmtTime(S.buffs.dw - S.t)}`]);
  if (S.t < S.buffs.brage) buffs.push(['spell_nature_ancestralguardian', `Berserker Rage ${fmtTime(S.buffs.brage - S.t)}`]);
  if (S.bloodrageTicks > 0) buffs.push(['ability_racial_bloodrage', `Bloodrage ${S.bloodrageTicks}`]);
  if (S.t < S.buffs.crusMH) buffs.push(['spell_holy_blessingofstrength', `Holy Strength ${fmtTime(S.buffs.crusMH - S.t)}`]);
  if (S.t < S.buffs.crusOH) buffs.push(['spell_holy_blessingofstrength', `Holy Strength (off hand) ${fmtTime(S.buffs.crusOH - S.t)}`]);
  if (S.t < S.buffs.potion) buffs.push(['inv_potion_41', `Mighty Rage ${fmtTime(S.buffs.potion - S.t)}`]);
  if (S.flurry > 0) buffs.push(['ability_ghoulfrenzy', `Flurry (${S.flurry})`]);
  if (S.rendTicks > 0) buffs.push(['ability_gouge', `Rend ${fmtTime(S.rendNext + (S.rendTicks - 1) * CFG.rendEvery - S.t)}`]);
  if (S.woundTicks > 0) buffs.push(['ability_backstab', `Deep Wounds (${S.woundTicks})`]);
  if (S.t < S.overpowerUntil) buffs.push(['ability_meleedamage', `Overpower ready ${fmtTime(S.overpowerUntil - S.t)}`]);
  const html = buffs.map(([icon, text]) => `<div class="buff"><img src="${iconUrl(icon)}" alt="">${text}</div>`).join('');
  if ($('buffs').innerHTML !== html) $('buffs').innerHTML = html;

  $('meter').innerHTML = `DPS <b>${S.t > 0 ? (S.totalDamage / S.t).toFixed(1) : '0.0'}</b> · ` +
    `Damage <b>${S.totalDamage.toLocaleString()}</b> · Time <b>${fmtTime(S.t)}</b>`;
}

function frame(now) {
  // Cap the step so a backgrounded tab pauses rather than fast-forwarding
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  if (S.started && !S.over) tick(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
