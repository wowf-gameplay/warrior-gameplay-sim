<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WoW Forever Fury Warrior Simulator</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #14110e; color: #e8dcc0;
    font-family: "Segoe UI", Tahoma, sans-serif; display: flex; justify-content: center;
    user-select: none;
  }
  body { align-items: flex-start; flex-wrap: wrap; }
  #app { width: 100%; max-width: 760px; padding: 16px; }
  #buffpanel {
    width: 230px; margin: 16px 0 0 16px; padding: 10px 12px 12px; position: sticky; top: 16px;
    background: #1b1611; border: 1px solid #4a3b28; border-radius: 6px;
  }
  #buffpanel { max-height: calc(100vh - 32px); overflow-y: auto; }
  #buffpanel h2 { font-size: 15px; color: #c79c6e; margin: 0 0 8px; }
  #buffpanel section + section { margin-top: 14px; padding-top: 10px; border-top: 1px solid #3a2f20; }
  .buffbtns { display: flex; gap: 6px; margin-bottom: 8px; }
  .buffbtns button {
    flex: 1; font: inherit; font-size: 12px; font-weight: 600; padding: 4px; cursor: pointer;
    background: #3a2c1e; color: #e8dcc0; border: 1px solid #6b5a3a; border-radius: 4px;
  }
  .buffbtns button:hover { border-color: #c79c6e; }
  .rbuff {
    display: flex; align-items: center; gap: 8px; padding: 5px 4px; cursor: pointer; border-radius: 4px;
    font-size: 12px; opacity: .55;
  }
  .rbuff:hover { background: #2b2318; }
  .rbuff.on { opacity: 1; }
  .rbuff img { width: 26px; height: 26px; border: 1px solid #6b5a3a; border-radius: 4px; flex: none; }
  .rbuff.on img { border-color: #ffd100; }
  .rbuff small { display: block; color: #8f846e; font-size: 10px; line-height: 1.25; }
  .rbuff input { accent-color: #ffd100; flex: none; }
  @media (max-width: 1040px) { #buffpanel { position: static; width: calc(100% - 32px); max-width: 728px; } }
  #startwrap {
    display: none; position: absolute; inset: 40px 0 0; z-index: 3; align-items: center; justify-content: center;
    background: rgba(20, 17, 14, .6);
  }
  #arena.idle #startwrap { display: flex; flex-direction: column; gap: 14px; }
  #hpsetting { font-size: 13px; color: #e8dcc0; display: flex; align-items: center; gap: 8px; }
  #hpinput {
    width: 120px; padding: 5px 8px; font: inherit; font-size: 14px; font-weight: 700; text-align: right;
    background: #1b1611; color: #ffd100; border: 1px solid #6b5a3a; border-radius: 4px;
  }
  #start {
    font: inherit; font-size: 22px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
    padding: 16px 44px; color: #fff; background: linear-gradient(#3fa535, #1f6a1a); border: 2px solid #7fdc6f; border-radius: 8px;
  }
  #start:hover { filter: brightness(1.15); }
  header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; }
  h1 { font-size: 20px; margin: 0; color: #c79c6e; }
  #meter { font-size: 14px; color: #b9ad92; font-variant-numeric: tabular-nums; }
  #meter b { color: #ffd100; }

  #arena {
    position: relative; height: 300px; margin-top: 12px; overflow: hidden;
    background: radial-gradient(ellipse at 50% 80%, #3a2c1e 0%, #1c1611 70%);
    border: 1px solid #4a3b28; border-radius: 6px;
  }
  #target {
    position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%);
    text-align: center; color: #b9ad92; font-size: 12px;
  }
  #target svg { display: block; margin: 0 auto 4px; }
  #target.hit svg { animation: shake .15s; }
  @keyframes shake { 25% { transform: translateX(-4px) rotate(-2deg); } 75% { transform: translateX(4px) rotate(2deg); } }

  #hpbar {
    position: absolute; left: 12px; right: 12px; top: 10px; height: 20px; background: #1a2a12;
    border: 1px solid #3d5a2a; border-radius: 4px; overflow: hidden;
  }
  #hpfill { height: 100%; width: 100%; background: linear-gradient(#4fb53a, #2e7d20); }
  #hpbar.execute #hpfill { background: linear-gradient(#e0362a, #a3160e); }
  #hpmark { position: absolute; left: 20%; top: 0; bottom: 0; width: 2px; background: #ffd100; opacity: .7; }
  #hptext {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; text-shadow: 1px 1px 2px #000; font-variant-numeric: tabular-nums;
  }
  .floater {
    position: absolute; font-weight: 800; font-size: 20px; pointer-events: none; white-space: nowrap;
    text-shadow: 0 0 3px #000, 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
    animation: floatUp 1.4s ease-out forwards; transform: translateX(-50%);
  }
  .floater.white { color: #fff; }
  .floater.yellow { color: #ffe100; }
  .floater.crit { font-size: 34px; animation-name: floatCrit; }
  .floater.avoid { color: #ddd; font-size: 16px; font-weight: 600; }
  .floater.bleed { font-size: 14px; }
  .floater.rage { color: #ff5a4a; font-size: 15px; }
  @keyframes floatUp {
    from { opacity: 1; margin-top: 0; } 70% { opacity: 1; } to { opacity: 0; margin-top: -130px; }
  }
  @keyframes floatCrit {
    0% { opacity: 1; margin-top: 0; font-size: 50px; } 15% { font-size: 34px; }
    70% { opacity: 1; } 100% { opacity: 0; margin-top: -130px; }
  }

  #stances { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12px; color: #b9ad92; }
  .stance {
    display: flex; align-items: center; gap: 6px; padding: 3px 10px 3px 3px; cursor: pointer; font: inherit; font-size: 12px;
    background: #1b1611; color: #8f846e; border: 2px solid #3a2f20; border-radius: 6px; opacity: .6;
  }
  .stance img { width: 26px; height: 26px; border-radius: 4px; display: block; }
  .stance.active { opacity: 1; color: #ffd100; font-weight: 700; border-color: #ffd100; box-shadow: 0 0 8px rgba(255, 209, 0, .5); }
  .ability.proc { border-color: #ffe100; animation: proc .6s infinite alternate; }
  @keyframes proc { from { box-shadow: 0 0 4px #ffe100; } to { box-shadow: 0 0 14px #ffe100, inset 0 0 10px rgba(255,225,0,.5); } }
  #buffs { height: 62px; overflow: hidden; margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; align-content: flex-start; }
  .buff { height: 28px; }
  .buff {
    font-size: 12px; padding: 4px 8px; border-radius: 4px; background: #2b2318;
    border: 1px solid #6b5a3a; color: #ffd100; font-variant-numeric: tabular-nums;
  }

  .swing { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 11px; color: #b9ad92; }
  .swing span { width: 62px; }
  .swingbar { flex: 1; height: 6px; background: #241d15; border-radius: 3px; overflow: hidden; }
  .swingbar div { height: 100%; width: 0; background: #c9c2b0; }

  #ragebar {
    position: relative; height: 28px; margin-top: 10px; background: #2a0d0a;
    border: 1px solid #5c1f18; border-radius: 4px; overflow: hidden;
  }
  #ragefill { height: 100%; width: 0; background: linear-gradient(#e0362a, #a3160e); }
  #ragetext {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px; text-shadow: 1px 1px 2px #000; font-variant-numeric: tabular-nums;
  }

  #bar { display: grid; grid-template-columns: repeat(11, 1fr); gap: 6px; margin-top: 12px; }
  .slot { text-align: center; font-size: 10px; color: #b9ad92; line-height: 1.2; }
  .ability {
    position: relative; display: block; width: 100%; aspect-ratio: 1; margin-bottom: 3px;
    border: 2px solid #6b5a3a; border-radius: 6px; overflow: hidden;
    background: #2a1712 center / cover no-repeat; color: #f3e6c8; cursor: pointer; padding: 0; font: inherit;
  }
  .ability:hover { border-color: #c79c6e; }
  .ability:active { transform: scale(.95); }
  .ability .key, .ability .cost {
    position: absolute; font-size: 11px; font-weight: 700;
    text-shadow: 0 0 2px #000, 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
  }
  .ability .key { top: 2px; left: 4px; color: #fff; }
  .ability .cost { bottom: 2px; right: 4px; color: #ff8a7b; }

  #tab-combat { position: relative; }
  #summary {
    display: none; position: absolute; inset: 12px 0 0; z-index: 5; padding: 4px 18px 18px; overflow: auto;
    background: rgba(20, 17, 14, .97); border: 1px solid #c79c6e; border-radius: 6px;
  }
  #summary.show { display: block; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .wcl-meta { font-size: 12px; color: #b9ad92; margin: 4px 0 2px; }
  .wcl-meta b { color: #ffd100; }
  table.wcl { font-size: 12px; background: #0b0b0b; border: 1px solid #333; margin-top: 8px; }
  table.wcl th { background: #1a1a1a; color: #e1f2f5; font-size: 11px; padding: 5px 6px; border-bottom: 1px solid #333; white-space: nowrap; }
  table.wcl td { padding: 3px 6px; border-bottom: 1px solid #1c1c1c; color: #ddd; white-space: nowrap; }
  table.wcl tr:nth-child(even) td { background: #121212; }
  table.wcl tr:hover td { background: #1e2a30; }
  .wcl-name { color: #ffe680 !important; font-weight: 600; }
  .wcl-name img { width: 18px; height: 18px; vertical-align: middle; margin-right: 6px; border: 1px solid #444; }
  .wcl-amount { width: 34%; }
  .wcl-amount > span { display: inline-block; vertical-align: middle; }
  .wcl-pct { width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
  .wcl-bar { width: calc(100% - 110px); height: 12px; margin: 0 6px; }
  .wcl-bar i { display: block; height: 100%; background: #c79c6e; border-radius: 1px; }
  .wcl-total { width: 50px; text-align: right; font-variant-numeric: tabular-nums; }
  .wcl-totalrow td { background: #1a1a1a !important; font-weight: 700; color: #fff; border-top: 1px solid #333; }
  .reset {
    display: block; width: 100%; margin-top: 14px; padding: 14px; cursor: pointer;
    font: inherit; font-size: 20px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase;
    color: #fff; background: linear-gradient(#c0392b, #7d1810); border: 2px solid #e0685c; border-radius: 8px;
  }
  .reset:hover { filter: brightness(1.15); }
  .reset:active { transform: scale(.99); }
  nav { display: flex; gap: 4px; margin-top: 12px; border-bottom: 1px solid #4a3b28; }
  nav button {
    font: inherit; font-size: 13px; font-weight: 600; padding: 6px 16px; cursor: pointer;
    background: #1b1611; color: #b9ad92; border: 1px solid #4a3b28; border-bottom: none; border-radius: 6px 6px 0 0;
  }
  nav button.active { background: #3a2c1e; color: #ffd100; }
  .tab { display: none; }
  .tab.active { display: block; }

  table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13px; }
  th { text-align: left; color: #c79c6e; font-size: 12px; padding: 4px 8px; border-bottom: 1px solid #4a3b28; }
  td { padding: 5px 8px; border-bottom: 1px solid #2b2318; vertical-align: middle; }
  td.dim, .dim { color: #8f846e; }
  .q-epic { color: #a335ee; font-weight: 600; } .q-rare { color: #0070dd; font-weight: 600; }
  .custom-toggle { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .custom-toggle input { accent-color: #ffd100; width: 16px; height: 16px; }
  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-top: 10px; }
  .fields label { font-size: 12px; color: #b9ad92; display: flex; flex-direction: column; gap: 3px; }
  .fields input {
    padding: 6px 8px; font: inherit; font-size: 15px; font-weight: 700; background: #1b1611; color: #ffd100;
    border: 1px solid #6b5a3a; border-radius: 4px; width: 100%;
  }
  .fields.off { opacity: .45; }
  .plain-btn {
    font: inherit; font-size: 12px; font-weight: 600; padding: 5px 12px; margin-top: 10px; cursor: pointer;
    background: #3a2c1e; color: #e8dcc0; border: 1px solid #6b5a3a; border-radius: 4px;
  }
  .plain-btn:hover { border-color: #c79c6e; }
  .tab h2 { font-size: 15px; color: #c79c6e; margin: 18px 0 0; }
  .statgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px; margin-top: 10px; }
  .stat { background: #1b1611; border: 1px solid #3a2f20; border-radius: 4px; padding: 6px 10px; font-size: 12px; color: #b9ad92; }
  .stat b { display: block; font-size: 17px; color: #ffd100; }
  .talent-icon, .buff img { width: 28px; height: 28px; border: 1px solid #6b5a3a; border-radius: 4px; display: block; }
  .buff { display: flex; align-items: center; gap: 6px; }
  .buff img { width: 18px; height: 18px; }
  .ench { color: #1eff00; font-size: 11px; }
  .rank { color: #ffd100; font-weight: 700; white-space: nowrap; }
  .tag { font-size: 10px; padding: 1px 6px; border-radius: 8px; white-space: nowrap; }
  .trees { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; }
  .tree { background: #1b1611; border: 1px solid #3a2f20; border-radius: 6px; padding: 0 14px 14px; margin-top: 12px; }
  .tree h2 { margin: 10px 0; text-align: center; }
  .tgrid { display: grid; grid-template-columns: repeat(4, 40px); grid-template-rows: repeat(7, 40px); gap: 14px 10px; }
  .tnode {
    position: relative; z-index: 1; width: 40px; height: 40px; border: 2px solid #ffd100; border-radius: 5px;
    background: #2a1712 center / cover no-repeat;
  }
  .tnode span {
    position: absolute; right: -6px; bottom: -6px; font-size: 10px; font-weight: 700; padding: 0 3px;
    background: #000; border-radius: 3px; color: #ffd100;
  }
  .tnode.partial { border-color: #40bf40; } .tnode.partial span { color: #40bf40; }
  .tnode.empty { border-color: #4a4338; filter: grayscale(1) brightness(.8); } .tnode.empty span { color: #999; }
  .tnode i {
    position: absolute; left: -6px; top: -6px; font-size: 9px; font-style: normal; font-weight: 700; padding: 0 3px;
    background: #1f3a1c; color: #7fdc6f; border-radius: 3px;
  }
  .tlink { width: 4px; justify-self: center; background: #4a4338; margin: 20px 0; }
  .tlink.on { background: #ffd100; }
  #talent-tip {
    display: none; position: fixed; z-index: 50; max-width: 300px; padding: 9px 11px; pointer-events: none;
    background: #0d0b08; border: 1px solid #c79c6e; border-radius: 6px; box-shadow: 0 4px 14px rgba(0, 0, 0, .7);
    font-size: 12px; line-height: 1.4; color: #e8dcc0;
  }
  #talent-tip .tip-head { display: flex; justify-content: space-between; gap: 14px; align-items: baseline; }
  #talent-tip .tip-head b { font-size: 14px; color: #fff; }
  #talent-tip .tip-head span { color: #b9ad92; white-space: nowrap; }
  #talent-tip .tip-new { color: #7fdc6f; font-size: 11px; }
  #talent-tip .tip-desc { color: #ffd100; margin-top: 5px; }
  #talent-tip .tip-status { margin-top: 6px; font-size: 11px; color: #8f846e; }
  #talent-tip .tip-status.sim { color: #7fdc6f; }
  .tnode { cursor: help; }
  .tag.sim { background: #1f3a1c; color: #7fdc6f; } .tag.off { background: #2b2318; color: #8f846e; }
  .ability .cdmask { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: rgba(0,0,0,.72); pointer-events: none; }
  .ability .cdtext {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 800; color: #fff; text-shadow: 1px 1px 2px #000; pointer-events: none;
  }
  #keybar { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 12px; color: #b9ad92; }
  #keybar button {
    font: inherit; font-size: 12px; font-weight: 600; padding: 4px 10px; cursor: pointer;
    background: #3a2c1e; color: #e8dcc0; border: 1px solid #6b5a3a; border-radius: 4px;
  }
  #keybar button:hover { border-color: #c79c6e; }
  #keybar button.active { background: #ffd100; color: #14110e; border-color: #ffd100; }
  #rebind-hint.warn { color: #ff7a6b; font-weight: 700; }
  #rebind-reset { display: none; }
  #keybar.editing #rebind-reset { display: inline-block; }
  #bar.editing .ability { filter: none; border-style: dashed; border-color: #c79c6e; }
  #bar.editing .ability.rebind-target { border-style: solid; border-color: #40bf40; box-shadow: 0 0 10px #40bf40; }
  .ability.norage { filter: grayscale(.8) brightness(.6); }
  .ability.queued { border-color: #ffe100; box-shadow: 0 0 10px #ffe100, inset 0 0 10px rgba(255,225,0,.4); }
  .ability.denied { animation: denied .2s; }
  @keyframes denied { 50% { border-color: #ff3020; } }

  #log {
    margin-top: 12px; height: 132px; overflow: hidden; font-size: 12px; line-height: 1.35;
    background: #1b1611; border: 1px solid #3a2f20; border-radius: 4px; padding: 6px 8px;
    display: flex; flex-direction: column; justify-content: flex-end; color: #b9ad92;
  }
  #log .y { color: #ffe100; } #log .w { color: #fff; } #log .r { color: #ff7a6b; }
  footer { margin-top: 10px; font-size: 11px; color: #7d735f; line-height: 1.4; }
</style>
</head>
<body>
<aside id="buffpanel"></aside>
<div id="app">
  <header>
    <h1>WoW Forever &mdash; Fury Warrior (60)</h1>
    <div id="meter"></div>
  </header>

  <nav>
    <button data-tab="combat" class="active">Combat</button>
    <button data-tab="gear">Gear</button>
    <button data-tab="talents">Talents</button>
    <button data-tab="stats">Stats</button>
  </nav>

  <div id="tab-combat" class="tab active">
  <div id="summary">
    <h2>Damage Done</h2>
    <div id="summary-body"></div>
    <button class="reset">Reset</button>
  </div>
  <div id="arena">
    <div id="hpbar"><div id="hpfill"></div><div id="hpmark"></div><div id="hptext"></div></div>
    <div id="startwrap">
      <button id="start">Start fight</button>
      <label id="hpsetting">Dummy health <input id="hpinput" type="number" min="1000" max="100000000" step="5000"></label>
    </div>
    <div id="target">
      <svg width="90" height="130" viewBox="0 0 90 130">
        <rect x="41" y="60" width="8" height="70" fill="#6b4a2a"/>
        <rect x="10" y="52" width="70" height="8" rx="3" fill="#7a5632"/>
        <ellipse cx="45" cy="72" rx="20" ry="26" fill="#b08a55" stroke="#6b4a2a" stroke-width="2"/>
        <circle cx="45" cy="28" r="18" fill="#c9a36a" stroke="#6b4a2a" stroke-width="2"/>
        <circle cx="45" cy="72" r="9" fill="none" stroke="#a3160e" stroke-width="3"/>
        <circle cx="45" cy="72" r="2.5" fill="#a3160e"/>
      </svg>
      Raid Boss Dummy (Level 63)
    </div>
  </div>

  <div id="stances">
    Stance
    <button class="stance" data-stance="battle" title="Battle Stance. Overpower switches here and back automatically."><img src="https://wow.zamimg.com/images/wow/icons/large/ability_warrior_offensivestance.jpg" alt="">Battle</button>
    <button class="stance" data-stance="berserker" title="Berserker Stance. +3% crit. Required for Whirlwind, Berserker Rage and Recklessness."><img src="https://wow.zamimg.com/images/wow/icons/large/ability_racial_avatar.jpg" alt="">Berserker</button>
  </div>
  <div id="buffs"></div>
  <div class="swing"><span>Main hand</span><div class="swingbar"><div id="mhbar"></div></div></div>
  <div class="swing"><span>Off hand</span><div class="swingbar"><div id="ohbar"></div></div></div>

  <div id="ragebar"><div id="ragefill"></div><div id="ragetext"></div></div>
  <div id="bar"></div>
  <div id="keybar">
    <button id="rebind">Change keybinds</button>
    <button id="rebind-reset">Reset keybinds</button>
    <span id="rebind-hint"></span>
  </div>
  <div id="log"></div>
  <button class="reset">Reset</button>
  <footer id="footer"></footer>
  </div>

  <div id="tab-gear" class="tab"></div>
  <div id="tab-talents" class="tab"></div>
  <div id="tab-stats" class="tab"></div>
</div>

<script>
// ---------------------------------------------------------------------------
// Character / target setup. Tweak these to change gear.
// ---------------------------------------------------------------------------
const BASE = { race: 'Human', str: 120, agi: 80, ap: 160 };  // level 60 warrior, naked
const BATTLE_SHOUT_AP = 139;                                 // Forever rank 7
const CRIT_RATING_PER_PCT = 14, HIT_RATING_PER_PCT = 10;     // Forever item ratings at level 60

// Gear and enchants from the MythicSim WoW Forever "DPS Warrior" tier-list preset (both trinket slots empty).
// ench: stats added by the enchant on that slot.
const GEAR = [
  { slot: 'Head',      name: 'Lionheart Helm',          q: 'epic', icon: 'inv_helmet_36', str: 18, hitRating: 20, critRating: 28, enchant: '+8 Strength', ench: { str: 8 } },
  { slot: 'Neck',      name: 'Imperial Jewel',          q: 'rare', icon: 'inv_misc_gem_sapphire_01', ap: 32 },

const rand = (a, b) => a + Math.random() * (b - a);
const addRage = n => {
  const gained = Math.min(n, 100 - S.rage);
  S.rage += gained; S.rageGained += gained; S.rageWasted += n - gained;
};
const damageMult = () => CFG.armorMult * (S.t < S.buffs.dw ? 1.2 : 1);
const critChance = () => Math.max(0, CFG.crit - CFG.critSuppression - (S.stance === 'berserker' ? 0 : CFG.berserkerCrit)) +
  (S.t < S.buffs.reck ? 100 : 0);

const weaponRoll = (w, speedForAp) => rand(w.min, w.max) + ap() / 14 * (speedForAp ?? w.speed);

function rollWhite(isOffhand) {
  const miss = Math.max(0, CFG.baseMiss + CFG.dwMissPenalty - CFG.hit - (isOffhand ? CFG.offhandHit : 0));
  let r = Math.random() * 100;
  if ((r -= miss) < 0) return 'miss';
  if ((r -= CFG.dodge) < 0) return 'dodge';
  if ((r -= CFG.glanceChance) < 0) return 'glance';
  if ((r -= critChance()) < 0) return 'crit';
  return 'hit';
}

function rollYellow(opts = {}) {
  const miss = Math.max(0, CFG.baseMiss - CFG.hit);
  const r = Math.random() * 100;
  if (r < miss) return 'miss';
  if (!opts.noDodge && r < miss + CFG.dodge) return 'dodge';
  return Math.random() * 100 < critChance() + (opts.critBonus || 0) ? 'crit' : 'hit';
}

function damageTarget(name, dmg, crit) {
  dmg = Math.min(dmg, Math.ceil(S.hp));
  S.totalDamage += dmg;
  S.hp -= dmg;
  const st = statFor(name);
  st.dmg += dmg; st.hits++; if (crit) st.crits++;
  if (S.hp <= 0) endFight();
  return dmg;
}

function deal(name, dmg, crit, cls, noFlurry) {
  if (S.over) return 0;
  dmg = damageTarget(name, Math.round(dmg), crit);
  floater(dmg + (crit ? '!' : ''), cls + (crit ? ' crit' : ''));
  log(`<span class="${cls === 'yellow' ? 'y' : 'w'}">${name} ${crit ? 'crits' : 'hits'} for ${dmg}.</span>`);
  if (crit) {
    if (!noFlurry) S.flurry = 3;
    // Deep Wounds 3/3: each crit adds 60% of the main hand's average weapon damage (no attack power),
    // rolled together with whatever the running bleed still owed, over 4 ticks
    const owed = S.woundTicks * S.woundTickDmg;
    S.woundTickDmg = (owed + 0.6 * (CFG.mh.min + CFG.mh.max) / 2) / 4;
    S.woundTicks = 4; S.woundNext = S.t + 3;
  }
  targetEl.classList.remove('hit'); void targetEl.offsetWidth; targetEl.classList.add('hit');
  return dmg;
}

function avoided(name, res) {
  if (S.over) return;
  statFor(name).avoided++;
  const word = res === 'miss' ? 'Miss' : 'Dodge';
  if (res === 'dodge') S.overpowerUntil = S.t + CFG.overpowerWindow;
  floater(word, 'avoid');
  log(`${name}: ${word.toLowerCase()}.`);
}

// Special attack. `cost` has already been paid; part is refunded if avoided.
// Weapon procs on a landed hit
function weaponProcs(isOffhand, allowExtra) {
  if (CFG.chili && S.t >= S.chiliReady && !S.over && Math.random() < CFG.chiliChance) {
    S.chiliReady = S.t + CFG.chiliCd;
    const dmg = damageTarget('Dragonbreath Chili', CFG.chiliDamage, false);
    floater(dmg, 'yellow bleed');
    log(`<span class="y">Dragonbreath Chili hits for ${dmg}.</span>`);
  }
  const w = isOffhand ? CFG.oh : CFG.mh;
  if (Math.random() < CFG.crusaderPpm * w.speed / 60) {
    S.buffs[isOffhand ? 'crusOH' : 'crusMH'] = S.t + 15;
    log('<span class="r">You gain Holy Strength.</span>');
  }
  if (!isOffhand && allowExtra && Math.random() < CFG.ironfoeChance) {
    log('<span class="r">Ironfoe grants 2 extra attacks.</span>');
    whiteAttack(false, 'Ironfoe');
    whiteAttack(false, 'Ironfoe');
  }
  if (!isOffhand && allowExtra && CFG.windfury && Math.random() < CFG.windfuryChance) {
    log('<span class="r">Windfury grants an extra attack.</span>');
    whiteAttack(false, 'Windfury', CFG.windfuryAp);
  }
}

function yellowAttack(name, base, cost, refund, isOffhand = false, opts) {
  const res = rollYellow(opts);
  if (res === 'miss' || res === 'dodge') {
    avoided(name, res);
    if (refund) addRage(cost * CFG.refundOnAvoid);
    return false;
  }
  const crit = res === 'crit';
  deal(name, base * damageMult() * (crit ? CFG.abilityCritMult : 1) + CFG.arthas, crit, 'yellow', opts?.noFlurry);
  if (opts?.swing) {
    if (!crit && S.flurry > 0) S.flurry--;
    if (Math.random() < CFG.unbridledWrath) addRage(1);
  }
  weaponProcs(isOffhand, true);
  return true;
}

function whiteAttack(isOffhand, extra = false, bonusAp = 0) {
  const w = isOffhand ? CFG.oh : CFG.mh;
  const name = isOffhand ? 'Off hand' : extra ? `Main hand (${extra})` : 'Main hand';
  const res = rollWhite(isOffhand);
  if (res === 'miss' || res === 'dodge') return avoided(name, res);
  let dmg = (weaponRoll(w) + bonusAp / 14 * w.speed) * (isOffhand ? CFG.offhandMult : 1) * damageMult();
  if (res === 'glance') dmg *= CFG.glanceMult;
  if (res === 'crit') dmg *= 2;
  dmg = deal(name, dmg + CFG.arthas, res === 'crit', 'white');
  if (res !== 'crit' && S.flurry > 0) S.flurry--;
  // Glancing blows give full rage; misses and dodges (returned above) give none
  addRage(CFG.ragePerSpeed * w.speed * (isOffhand ? CFG.offhandRageBase * CFG.offhandRageMult : 1) *
    (res === 'crit' ? CFG.critRageMult : 1));
  if (Math.random() < CFG.unbridledWrath) addRage(1);
  weaponProcs(isOffhand, !extra);
}

function mainHandSwing() {
  const q = S.queued && ABILITY[S.queued];
  S.queued = null;
  if (q && S.rage >= q.cost) {
    S.rage -= q.cost;
    yellowAttack(q.name, weaponRoll(CFG.mh) + q.bonus, q.cost, true, false, { swing: true });
  } else {
    whiteAttack(false);
  }
}

  const lost = Math.max(0, S.rage - CFG.stanceRage);
  S.rage -= lost; S.rageWasted += lost;
  const name = stance === 'battle' ? 'Battle Stance' : 'Berserker Stance';
  floater(name, 'rage');
  log(`<span class="r">You enter ${name}${lost >= 1 ? ` and lose ${Math.round(lost)} rage` : ''}.</span>`);
}

function press(a) {
  if (!S.started || S.over) return;
  if (a.queue) {
    if (S.queued === a.id) S.queued = null;
    else if (S.rage >= a.cost) S.queued = a.id;
    else deny(a);
    return;
  }
  // Abilities that need another stance switch to it automatically (rage above the kept amount is lost)
  const swap = a.stance && a.stance !== S.stance;
  const rage = swap ? Math.min(S.rage, CFG.stanceRage) : S.rage;
  if (S.t < (S.ready[a.id] || 0) || (a.gcd && S.t < S.gcdUntil) || rage < a.cost || (a.usable && !a.usable()) ||
      (swap && S.t < S.stanceReady)) return deny(a);
  const from = S.stance;
  if (swap) setStance(a.stance);
  // Overpower flips back to the stance it came from as soon as the stance cooldown allows
  if (swap && a.returnStance) S.returnStance = from;
  S.rage -= a.cost;
  S.ready[a.id] = S.t + a.cd;
  if (a.gcd) S.gcdUntil = S.t + CFG.gcd;
  a.use();
}

function deny(a) {
  a.el.classList.remove('denied'); void a.el.offsetWidth; a.el.classList.add('denied');
}

// ---------------------------------------------------------------------------
// Simulation tick
// ---------------------------------------------------------------------------
function tick(dt) {
  S.t += dt;

  if (S.returnStance && S.t >= S.stanceReady) setStance(S.returnStance);

  S.amTimer += dt;
  while (S.amTimer >= CFG.angerMgmtInterval) { S.amTimer -= CFG.angerMgmtInterval; addRage(1); }

  while (S.bloodrageTicks > 0 && S.t >= S.bloodrageNext) {
    addRage(1.5); S.bloodrageTicks--; S.bloodrageNext += 1;
  }

  // Deep Wounds bleed tick: ignores armor and damage modifiers
  while (S.woundTicks > 0 && S.t >= S.woundNext && !S.over) {
    const dmg = Math.round(S.woundTickDmg);
    S.woundTicks--; S.woundNext += 3;
    damageTarget('Deep Wounds', dmg, false);
    floater(dmg, 'white bleed');
    log(`<span class="w">Deep Wounds ticks for ${dmg}.</span>`);
  }

  const haste = S.flurry > 0 ? CFG.flurryHaste : 1;
  S.mhProg += dt * haste / CFG.mh.speed;
  S.ohProg += dt * haste / CFG.oh.speed;
  if (S.mhProg >= 1) { S.mhProg -= 1; mainHandSwing(); }
  if (S.ohProg >= 1) { S.ohProg -= 1; offHandSwing(); }
}

function fmtTime(s) {
  if (s >= 60) return Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  return s >= 10 ? Math.ceil(s) : s.toFixed(1);
}

// Display name and icon for each damage source in the end-of-fight table
function sourceInfo(name) {
  const ability = ABILITIES.find(x => x.name === name);
  if (ability) return { label: name, icon: ability.icon };
  const mhIcon = GEAR.find(g => g.slot === 'Main hand').icon, ohIcon = GEAR.find(g => g.slot === 'Off hand').icon;
  return {
    'Main hand': { label: 'Melee', icon: mhIcon },
    'Off hand': { label: 'Melee (Off Hand)', icon: ohIcon },
    'Main hand (Windfury)': { label: 'Windfury Attack', icon: 'spell_nature_windfury' },
    'Main hand (Ironfoe)': { label: 'Ironfoe (Extra Attack)', icon: mhIcon },
    'Whirlwind (off hand)': { label: 'Whirlwind (Off Hand)', icon: 'ability_whirlwind' },
    'Deep Wounds': { label: 'Deep Wounds', icon: 'ability_backstab' },
    'Dragonbreath Chili': { label: 'Dragonbreath Chili', icon: 'inv_drink_17' },
  }[name] || { label: name, icon: 'inv_misc_questionmark' };
}

// Damage Done table laid out like a Warcraft Logs report
function endFight() {
  S.over = true;
  S.hp = 0;
  const n = v => Math.round(v).toLocaleString();
  const pct = (x, of) => of ? (x / of * 100).toFixed(1) + '%' : '-';
  const sources = Object.entries(S.stats).sort((x, y) => y[1].dmg - x[1].dmg);
  const top = sources.length ? sources[0][1].dmg : 1;
  let casts = 0, hits = 0, crits = 0, avoided = 0;
  const rows = sources.map(([name, st]) => {
    const info = sourceInfo(name);
    const isDot = name === 'Deep Wounds';
    const stCasts = st.hits + st.avoided;
    if (!isDot) { casts += stCasts; avoided += st.avoided; }
    hits += st.hits; crits += st.crits;
    return `<tr><td class="wcl-name"><img src="${iconUrl(info.icon)}" alt="">${info.label}</td>` +
      `<td class="wcl-amount"><span class="wcl-pct">${pct(st.dmg, S.totalDamage)}</span>` +
      `<span class="wcl-bar"><i style="width:${st.dmg / top * 100}%"></i></span><span class="wcl-total">${n(st.dmg)}</span></td>` +
      `<td class="num">${isDot ? '-' : stCasts}</td><td class="num">${isDot || !stCasts ? '-' : n(st.dmg / stCasts)}</td>` +
      `<td class="num">${st.hits}</td><td class="num">${st.hits ? n(st.dmg / st.hits) : '-'}</td>` +
      `<td class="num">${isDot ? '-' : pct(st.crits, st.hits)}</td><td class="num">${isDot ? '-' : pct(st.avoided, stCasts)}</td>` +
      `<td class="num">${(st.dmg / S.t).toFixed(1)}</td></tr>`;
  }).join('');
  $('summary-body').innerHTML =
    `<div class="wcl-meta">Fight length <b>${fmtTime(S.t)}</b> · Rage gained <b>${Math.round(S.rageGained)}</b> · ` +
    `Rage lost (cap and stance changes) <b>${Math.round(S.rageWasted)}</b></div>` +
    `<table class="wcl"><tr><th>Name</th><th>Amount</th><th class="num">Casts</th><th class="num">Avg Cast</th>` +
    `<th class="num">Hits</th><th class="num">Avg Hit</th><th class="num">Crit %</th><th class="num">Miss %</th><th class="num">DPS</th></tr>` +
    rows +
    `<tr class="wcl-totalrow"><td>Total</td><td class="wcl-amount"><span class="wcl-pct">100%</span><span class="wcl-bar"></span>` +
    `<span class="wcl-total">${n(S.totalDamage)}</span></td><td class="num">${casts}</td><td class="num">-</td>` +
    `<td class="num">${hits}</td><td class="num">-</td><td class="num">${pct(crits, hits)}</td><td class="num">${pct(avoided, casts)}</td>` +
    `<td class="num">${(S.totalDamage / S.t).toFixed(1)}</td></tr></table>`;
  $('summary').classList.add('show');
}

  $('summary').classList.remove('show');
  last = performance.now();
}

  const fill = () => {
    $('custom-on').checked = CUSTOM.on;
    $('custom-fields').classList.toggle('off', !CUSTOM.on);
    tab.querySelectorAll('input[data-k]').forEach(el => { el.value = CUSTOM[el.dataset.k]; });
  };
  const apply = () => {
    try { localStorage.setItem(CUSTOM_STORE, JSON.stringify(CUSTOM)); } catch {}
    $('custom-fields').classList.toggle('off', !CUSTOM.on);
    applySetup(); renderGearTab(); renderResultStats();
  };
  $('custom-on').addEventListener('change', e => { CUSTOM.on = e.target.checked; apply(); });
  $('custom-fields').addEventListener('input', e => {
    const f = FIELDS.find(f => f[0] === e.target.dataset.k);

  $('custom-copy').addEventListener('click', () => { Object.assign(CUSTOM, gearSheet()); fill(); apply(); });
  fill();
  renderResultStats();
}

      ['Concussion Blow', 0, 1, 5, 2, 'ability_thunderbolt', 'Stuns the target for 5 sec.'],
      ['Focused Rage', 0, 3, 5, 3, 'ability_warrior_focusedrage', 'Offensive abilities cost 3 less rage.', false, null, NEW],
      ['Bastion', 0, 5, 6, 3, 'inv_shield_04', '+10% damage dealt while a shield is equipped.'],
      ['Shield Slam', 0, 1, 7, 2, 'inv_shield_05', 'Slam the target with your shield; 50% chance to dispel 1 magic effect. Very high threat.', false, 'Concussion Blow'],
    ]},
  ];

  const treePoints = tree => tree.talents.reduce((n, t) => n + t[1], 0);
  const treeHtml = tree => {
    let cells = '';
    for (const [name, pts, max, row, col, icon, desc, sim, req, isNew] of tree.talents) {
      const state = pts === 0 ? 'empty' : pts === max ? 'full' : 'partial';
      if (req) {
        const from = tree.talents.find(t => t[0] === req);
        cells += `<div class="tlink ${pts ? 'on' : ''}" style="grid-column:${col};grid-row:${from[3]} / ${row + 1}"></div>`;
      }
      const esc = s => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;');
      cells += `<div class="tnode ${state}" style="grid-column:${col};grid-row:${row};background-image:url(${iconUrl(icon)})" ` +
        `data-name="${esc(name)}" data-pts="${pts}" data-max="${max}" data-desc="${esc(desc)}" data-sim="${sim ? 1 : ''}" data-isnew="${isNew ? 1 : ''}">` +
        (isNew ? '<i>new</i>' : '') + `<span>${pts}/${max}</span></div>`;
    }
    return `<div class="tree"><h2>${tree.name} <span class="dim">(${treePoints(tree)})</span></h2><div class="tgrid">${cells}</div></div>`;
  };

  $('tab-talents').innerHTML =
    `<div class="trees">${TREES.map(treeHtml).join('')}</div>` +
    `<footer>${TREES.map(treePoints).join(' / ')} (51 points). WoW Forever beta talent trees; talents are fixed. ` +
    `Hover a talent to see what it does and whether this simulation models it.</footer>`;
}

// --- Talent tooltips: hover a talent in the tree ---
{
  const tip = document.createElement('div');
  tip.id = 'talent-tip';
  document.body.appendChild(tip);
  let current = null;
  document.addEventListener('mousemove', e => {
    const node = e.target.closest ? e.target.closest('.tnode') : null;
    if (!node) { tip.style.display = 'none'; current = null; return; }
    if (node !== current) {
      current = node;
      const d = node.dataset;
      const taken = Number(d.pts) > 0;
      tip.innerHTML = `<div class="tip-head"><b></b><span>Rank ${d.pts}/${d.max}</span></div>` +
        (d.isnew ? '<div class="tip-new">New in Forever</div>' : '') + '<div class="tip-desc"></div>' +
        `<div class="tip-status ${taken && d.sim ? 'sim' : ''}">${!taken ? 'Not taken' : d.sim ? 'Simulated' : 'No effect in this simulation'}</div>`;
      tip.querySelector('b').textContent = d.name;
      tip.querySelector('.tip-desc').textContent = d.desc;
      tip.style.display = 'block';
    }
    // Keep the tooltip beside the cursor and inside the window
    const w = tip.offsetWidth, h = tip.offsetHeight;
    let x = e.clientX + 16, y = e.clientY + 16;
    if (x + w > window.innerWidth - 8) x = e.clientX - w - 12;
    if (y + h > window.innerHeight - 8) y = e.clientY - h - 12;
    tip.style.left = Math.max(8, x) + 'px';
    tip.style.top = Math.max(8, y) + 'px';
  });
}

// --- Keybinds: editable, saved in this browser ---
const KEY_STORE = 'warriorSimKeybinds';
let rebinding = false, rebindTarget = null;
// Browser shortcuts a page cannot take over: binding them would close or open tabs instead of using the ability
const RESERVED_KEYS = ['Ctrl+w', 'Ctrl+t', 'Ctrl+n', 'Ctrl+Shift+w', 'Ctrl+Shift+t', 'Ctrl+Shift+n'];
const RESERVED_NOTE = 'Ctrl+W, Ctrl+T and Ctrl+N belong to the browser and cannot be used.';
// A binding is the physical key plus optional Ctrl / Shift, e.g. "q", "Shift+1", "Ctrl+Shift+e".
// The base key comes from e.code so Shift+1 stays "1" instead of becoming "!".
const CODE_KEYS = {
  Minus: '-', Equal: '=', BracketLeft: '[', BracketRight: ']', Backquote: '`', Semicolon: ';', Quote: "'",
  Comma: ',', Period: '.', Slash: '/', Backslash: '\\', Space: ' ',
};
function baseKey(e) {
  const c = e.code || '';
  if (/^Digit\d$/.test(c)) return c.slice(5);
  if (/^Key[A-Z]$/.test(c)) return c.slice(3).toLowerCase();
  if (/^Numpad\d$/.test(c)) return 'Num' + c.slice(6);
  if (CODE_KEYS[c]) return CODE_KEYS[c];
  return e.key.length === 1 ? e.key.toLowerCase() : e.key;
}
const normKey = e => (e.ctrlKey ? 'Ctrl+' : '') + (e.shiftKey ? 'Shift+' : '') + baseKey(e);
function keyLabel(k) {
  if (!k) return '';
  const parts = k.split(/\+(?=.)/);          // keeps a trailing "+" key intact
  const base = parts.pop();
  const mods = parts.map(m => m[0]).join('');  // Ctrl -> C, Shift -> S
  const name = base === ' ' ? 'Spc' : base.length === 1 ? base.toUpperCase() : base.replace('Arrow', '').slice(0, 4);
  return (mods ? mods + '-' : '') + name;
}

function showKeys() {
  for (const a of ABILITIES) a.keyEl.textContent = keyLabel(a.key);
}
function saveKeys() {
  try { localStorage.setItem(KEY_STORE, JSON.stringify(Object.fromEntries(ABILITIES.map(a => [a.id, a.key])))); } catch {}
}
function selectRebind(a) {
  rebindTarget = a;
  for (const b of ABILITIES) b.el.classList.toggle('rebind-target', b === a);
  $('rebind-hint').classList.remove('warn');
  $('rebind-hint').textContent = a ? `Press a key for ${a.name}, with Shift or Ctrl if you like (Esc to cancel). ${RESERVED_NOTE}`
    : `Click an ability, then press the key you want. ${RESERVED_NOTE}`;
}
function setRebinding(on) {
  rebinding = on;
  $('bar').classList.toggle('editing', on);
  $('keybar').classList.toggle('editing', on);
  $('rebind').classList.toggle('active', on);
  $('rebind').textContent = on ? 'Done' : 'Change keybinds';
  selectRebind(null);
  if (!on) $('rebind-hint').textContent = '';
}
$('rebind').addEventListener('click', () => setRebinding(!rebinding));
$('rebind-reset').addEventListener('click', () => {
  for (const a of ABILITIES) a.key = a.defaultKey;
  saveKeys(); showKeys(); selectRebind(null);
});

try {
  const saved = JSON.parse(localStorage.getItem(KEY_STORE) || '{}');
  for (const a of ABILITIES) if (typeof saved[a.id] === 'string') a.key = saved[a.id];
} catch {}
showKeys();

document.addEventListener('keydown', e => {
  if (e.repeat || e.altKey || e.metaKey || e.target.tagName === 'INPUT') return;
  if (['Shift', 'Control', 'Alt', 'Meta', 'Tab', 'CapsLock'].includes(e.key)) return;
  const key = normKey(e);
  if (rebinding) {
    e.preventDefault();
    if (e.key === 'Escape') return rebindTarget ? selectRebind(null) : setRebinding(false);
    if (!rebindTarget) return;
    if (RESERVED_KEYS.includes(key)) {
      $('rebind-hint').classList.add('warn');
      $('rebind-hint').textContent = `${key.replace(/[a-z]$/, c => c.toUpperCase())} is a browser shortcut and cannot be bound. Pick another key for ${rebindTarget.name}.`;
      return;
    }
    // A key can only be bound to one ability: take it away from whichever had it
    for (const a of ABILITIES) if (a.key === key) a.key = '';
    rebindTarget.key = key;
    saveKeys(); showKeys(); selectRebind(null);
    return;
  }
  const a = ABILITIES.find(a => a.key && a.key === key);
  if (a) { e.preventDefault(); press(a); }
});

$('footer').textContent =
  `WoW Forever dual wield fury in Berserker Stance against a level 63 boss. ` +
  `Press Start fight, then use the keys shown on the buttons, or click, to use abilities. See the Gear and Talents tabs for the setup.`;

function render() {
  arenaEl.classList.toggle('idle', !S.started);
  document.querySelectorAll('.stance').forEach(btn => btn.classList.toggle('active', btn.dataset.stance === S.stance));
  const hpPct = S.hp / CFG.targetHp * 100;
  $('hpfill').style.width = hpPct + '%';
  $('hpbar').classList.toggle('execute', S.hp <= CFG.targetHp * CFG.executeRange);
  $('hptext').textContent = `${Math.ceil(S.hp).toLocaleString()} / ${CFG.targetHp.toLocaleString()} (${Math.ceil(hpPct)}%)`;
  $('ragefill').style.width = S.rage + '%';
  $('ragetext').textContent = Math.floor(S.rage) + ' / 100';
  $('mhbar').style.width = S.mhProg * 100 + '%';
  $('ohbar').style.width = S.ohProg * 100 + '%';

  for (const a of ABILITIES) {
    const cdLeft = (S.ready[a.id] || 0) - S.t;
    const gcdLeft = a.gcd ? S.gcdUntil - S.t : 0;
    let frac = 0;
    if (cdLeft > 0 && cdLeft >= gcdLeft) frac = cdLeft / a.cd;
    else if (gcdLeft > 0) frac = gcdLeft / CFG.gcd;
    a.mask.style.height = frac * 100 + '%';
    a.cdText.textContent = cdLeft > 0 ? fmtTime(cdLeft) : '';
    a.el.classList.toggle('norage', !S.started || S.rage < a.cost || !!(a.usable && !a.usable()));
    a.el.classList.toggle('queued', S.queued === a.id);
    if (a.proc) a.el.classList.toggle('proc', S.started && a.usable());
  }

  const buffs = [];
  if (S.t < S.buffs.reck) buffs.push(['ability_criticalstrike', `Recklessness ${fmtTime(S.buffs.reck - S.t)}`]);
  if (S.t < S.buffs.dw) buffs.push(['spell_shadow_deathpact', `Death Wish ${fmtTime(S.buffs.dw - S.t)}`]);
  if (S.t < S.buffs.brage) buffs.push(['spell_nature_ancestralguardian', `Berserker Rage ${fmtTime(S.buffs.brage - S.t)}`]);
  if (S.bloodrageTicks > 0) buffs.push(['ability_racial_bloodrage', `Bloodrage ${S.bloodrageTicks}`]);
  if (S.t < S.buffs.crusMH) buffs.push(['spell_holy_blessingofstrength', `Holy Strength ${fmtTime(S.buffs.crusMH - S.t)}`]);
  if (S.t < S.buffs.crusOH) buffs.push(['spell_holy_blessingofstrength', `Holy Strength (off hand) ${fmtTime(S.buffs.crusOH - S.t)}`]);
  if (S.t < S.buffs.potion) buffs.push(['inv_potion_41', `Mighty Rage ${fmtTime(S.buffs.potion - S.t)}`]);
  if (S.flurry > 0) buffs.push(['ability_ghoulfrenzy', `Flurry (${S.flurry})`]);
  if (S.woundTicks > 0) buffs.push(['ability_backstab', `Deep Wounds (${S.woundTicks})`]);
  const html = buffs.map(([icon, text]) => `<div class="buff"><img src="${iconUrl(icon)}" alt="">${text}</div>`).join('');
  if ($('buffs').innerHTML !== html) $('buffs').innerHTML = html;

  $('meter').innerHTML = `DPS <b>${S.t > 0 ? (S.totalDamage / S.t).toFixed(1) : '0.0'}</b> · ` +
    `Damage <b>${S.totalDamage.toLocaleString()}</b> · Time <b>${fmtTime(S.t)}</b>`;
}

function frame(now) {
  // Cap the step so a backgrounded tab pauses rather than fast-forwarding
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  if (S.started && !S.over) tick(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
